<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D-DAY 계산기</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f4f4f2;
    color: #1f1f1d;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    text-align: center;
    margin-bottom: 4px;
  }
  .card {
    background: #fff;
    border: 1px solid #e3e1da;
    border-radius: 14px;
    padding: 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #6b6b66;
    margin-bottom: 8px;
  }
  input[type="date"], input[type="number"] {
    width: 100%;
    font-size: 16px;
    padding: 12px;
    border: 1px solid #d3d1c7;
    border-radius: 10px;
    background: #fff;
    color: #1f1f1d;
    font-family: inherit;
  }
  .btns {
    display: flex;
    gap: 8px;
  }
  .btns button {
    flex: 1;
    font-size: 16px;
    padding: 14px 0;
    border: 1px solid #d3d1c7;
    border-radius: 10px;
    background: #fff;
    color: #1f1f1d;
    cursor: pointer;
    transition: background .15s;
  }
  .btns button:hover { background: #f1efe8; }
  .btns button:active { transform: scale(.98); }
  .custom {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .custom input { flex: 1; }
  .custom span { font-size: 14px; color: #6b6b66; white-space: nowrap; }
  .custom button {
    padding: 12px 18px;
    border: 1px solid #d3d1c7;
    border-radius: 10px;
    background: #fff;
    cursor: pointer;
    font-size: 16px;
  }
  .custom button:hover { background: #f1efe8; }
  .result {
    text-align: center;
    padding: 28px 20px;
  }
  #resLabel { font-size: 13px; color: #6b6b66; margin-bottom: 10px; }
  #resDate { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
  #resSub, #tSub {
    display: inline-block;
    font-size: 15px;
    font-weight: 600;
    color: #185fa5;
    background: #e6f1fb;
    padding: 4px 14px;
    border-radius: 8px;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e3e1da;
  }
  .divider span {
    font-size: 13px;
    color: #888780;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>D-DAY 계산기</h1>

    <div class="card">
      <label for="baseDate">기준일 (오늘 자동 입력 · 수정 가능)</label>
      <input type="date" id="baseDate">
    </div>

    <div class="btns">
      <button data-days="30">+30일</button>
      <button data-days="60">+60일</button>
      <button data-days="90">+90일</button>
    </div>

    <div class="card custom">
      <input type="number" id="customDays" placeholder="직접 입력">
      <span>일 뒤</span>
      <button id="customBtn">계산</button>
    </div>

    <div class="card result">
      <div id="resLabel">버튼을 눌러 날짜를 계산하세요</div>
      <div id="resDate">—</div>
      <div id="resSub" style="display:none;"></div>
    </div>

    <div class="divider"><span>목표일까지 며칠 남았나</span></div>

    <div class="card">
      <label for="targetDate">목표 날짜 (이 날까지 남은 일수 계산)</label>
      <input type="date" id="targetDate">
    </div>

    <div class="card result">
      <div id="tLabel">목표 날짜를 선택하세요</div>
      <div id="tDate">—</div>
      <div id="tSub" style="display:none;"></div>
    </div>
  </div>

<script>
(function(){
  var base = document.getElementById('baseDate');
  var resLabel = document.getElementById('resLabel');
  var resDate = document.getElementById('resDate');
  var resSub = document.getElementById('resSub');
  var W = ['일','월','화','수','목','금','토'];

  var t = new Date();
  base.value = t.getFullYear() + '-' +
    String(t.getMonth()+1).padStart(2,'0') + '-' +
    String(t.getDate()).padStart(2,'0');

  function calc(days){
    if(!base.value) return;
    var d = new Date(base.value + 'T00:00:00');
    d.setDate(d.getDate() + days);
    var w = W[d.getDay()];
    resLabel.textContent = (days>=0 ? '+'+days : days) + '일 뒤';
    resDate.textContent = d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+w+')';

    var now0 = new Date(); now0.setHours(0,0,0,0);
    var diff = Math.round((d - now0)/86400000);
    resSub.style.display = 'inline-block';
    resSub.textContent = diff>0 ? 'D-'+diff : (diff===0 ? 'D-DAY' : 'D+'+Math.abs(diff));
  }

  var btns = document.querySelectorAll('.btns button');
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener('click', function(){
      calc(parseInt(this.getAttribute('data-days')));
    });
  }
  document.getElementById('customBtn').addEventListener('click', function(){
    var v = parseInt(document.getElementById('customDays').value);
    if(!isNaN(v)) calc(v);
  });
  base.addEventListener('change', function(){
    resLabel.textContent = '버튼을 눌러 날짜를 계산하세요';
    resDate.textContent = '—';
    resSub.style.display = 'none';
  });

  var target = document.getElementById('targetDate');
  var tLabel = document.getElementById('tLabel');
  var tDate = document.getElementById('tDate');
  var tSub = document.getElementById('tSub');

  target.addEventListener('change', function(){
    if(!target.value){
      tLabel.textContent = '목표 날짜를 선택하세요';
      tDate.textContent = '—';
      tSub.style.display = 'none';
      return;
    }
    var d = new Date(target.value + 'T00:00:00');
    var w = W[d.getDay()];
    var now0 = new Date(); now0.setHours(0,0,0,0);
    var diff = Math.round((d - now0)/86400000);

    tDate.textContent = d.getFullYear()+'년 '+(d.getMonth()+1)+'월 '+d.getDate()+'일 ('+w+')';
    tSub.style.display = 'inline-block';

    if(diff > 0){
      tLabel.textContent = '오늘부터 '+diff+'일 남음';
      tSub.textContent = 'D-'+diff;
    } else if(diff === 0){
      tLabel.textContent = '오늘이 목표일입니다';
      tSub.textContent = 'D-DAY';
    } else {
      tLabel.textContent = Math.abs(diff)+'일 지났습니다';
      tSub.textContent = 'D+'+Math.abs(diff);
    }
  });
})();
</script>
</body>
</html>
