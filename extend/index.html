<title>제휴 연장 관리</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--soft:#f8fafc;--line:#e4e9f0;--line2:#d3dbe6;
--txt:#16233a;--sub:#69758a;--mute:#96a1b3;--blue:#2563eb;--blue2:#1d4ed8;--blue3:#1e40af;
--bbg:#eef4ff;--bbd:#bfd4fb;--red:#dc2626;--rbg:#fdecec;--rbd:#f0c9c9;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);padding-bottom:56px;font-size:15px;
font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:660px;margin:0 auto;padding:0 13px 13px}
.hd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:13px 0 11px}
.hr{display:flex;justify-content:space-between;align-items:center}
h1{font-size:15px;margin:0;font-weight:700}
.st{font-size:11px;color:var(--mute)}
.tabs{display:flex;gap:6px;margin-top:11px}
.tab{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;background:var(--soft);
color:var(--sub);border:1px solid var(--line);cursor:pointer;font-weight:600}
.tab.on{background:var(--bbg);color:var(--blue3);border-color:var(--bbd)}
.sr{display:flex;gap:7px;margin-top:10px}
#q{flex:1;min-width:0;background:var(--soft);border:1.5px solid var(--line2);border-radius:10px;
color:var(--txt);font-size:19px;padding:11px 8px;letter-spacing:3px;text-align:center;
outline:none;font-weight:700}
#q:focus{border-color:var(--blue);background:#fff}
#q::placeholder{letter-spacing:0;font-size:14px;font-weight:400;color:var(--mute)}
.b{border:1.5px solid var(--line2);background:var(--soft);border-radius:10px;padding:0 13px;
color:var(--sub);font-size:14px;cursor:pointer;font-weight:700;white-space:nowrap;flex-shrink:0}
.b:active{background:var(--line)}
.b.p{background:var(--blue);border-color:var(--blue);color:#fff}
.b.p:active{background:var(--blue2)}
.ht{font-size:12px;color:var(--sub);margin-top:9px}
.pan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px}
.pan.rd{border-color:var(--line)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;font-weight:700}
.exr{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.exr:last-child{border-bottom:none}
.exr:active{opacity:.6}
.en{font-size:14px;font-weight:700}
.em{font-size:11.5px;color:var(--sub);margin-left:6px}
.ed{font-size:13px;font-weight:700;color:var(--red);text-align:right}
.es{font-size:10.5px;color:var(--red);text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.card:active{background:var(--soft)}
.tp{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.nm{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pv{font-size:12px;color:var(--sub);margin-top:3px}
.pn{font-size:13px;color:var(--sub);margin-top:4px}
.ex{text-align:right;white-space:nowrap}
.ex .l{font-size:10px;color:var(--mute)}
.ex .d{font-size:15px;font-weight:700;margin-top:2px}
.bd{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
.ok{background:var(--bbg);color:var(--blue3)}
.so{background:var(--rbg);color:var(--red)}
.exd{background:var(--rbg);color:var(--red)}.bl{background:var(--bbg);color:var(--blue3)}
.tg{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.t{font-size:11px;background:var(--soft);color:var(--sub);padding:3px 9px;border-radius:20px;border:1px solid var(--line)}
.emp{text-align:center;color:var(--sub);padding:40px 20px;line-height:1.75;font-size:14px}
.msk{position:fixed;inset:0;background:rgba(16,28,48,.45);z-index:60;display:none;align-items:flex-end;justify-content:center}
.msk.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:660px;border-radius:18px 18px 0 0;max-height:93vh;overflow-y:auto;padding-bottom:26px}
.shd{position:sticky;top:0;background:var(--card);padding:15px 16px 13px;border-bottom:1px solid var(--line);
display:flex;justify-content:space-between;gap:10px;align-items:flex-start;z-index:5}
.n2{font-size:19px;font-weight:700}.s2{font-size:12px;color:var(--sub);margin-top:4px}
.x{background:var(--soft);border:1px solid var(--line);color:var(--sub);width:32px;height:32px;border-radius:9px;font-size:17px;cursor:pointer;flex-shrink:0}
.sb{padding:13px 16px}
.bx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px}
.eb{background:var(--bbg);border:1px solid var(--bbd);border-radius:12px;padding:15px;text-align:center;margin-bottom:12px}
.eb .l{font-size:12px;color:var(--blue3)}
.eb .v{font-size:26px;font-weight:800;color:var(--blue3);margin-top:3px}
.eb .r{font-size:12.5px;margin-top:5px;color:var(--blue3)}

.eg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.e{padding:13px 5px;border-radius:11px;text-align:center;color:#fff;cursor:pointer}
.e:active{opacity:.85}
.e1,.e2,.e3{background:var(--blue)}
.e:active{background:var(--blue2)}
.e .a{font-size:17px;font-weight:800}.e .c{font-size:11px;margin-top:2px}
.eg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.e2b{padding:11px 5px;border-radius:11px;text-align:center;cursor:pointer;
background:var(--bbg);border:1px solid var(--bbd);color:var(--blue3)}
.e2b:active{background:#e2ecfd}
.e2b.off{background:var(--soft);border-color:var(--line);color:var(--mute)}
.e2b.on{background:var(--blue);border-color:var(--blue);color:#fff}
.adj{text-align:center;font-size:12px;color:var(--blue);margin-top:7px;cursor:pointer;
padding:5px;font-weight:700}
.adj:active{opacity:.5}
.a2{font-size:14px;font-weight:800}
.c2{font-size:10.5px;margin-top:2px;opacity:.85}
.pw{font-size:12px;color:var(--blue3);text-align:center;min-height:17px;margin:9px 0 11px;font-weight:700}
.lb{font-size:12.5px;font-weight:700;color:var(--sub);margin:0 0 8px}
.mi,.fi{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:9px;color:var(--txt);
padding:10px;font-size:14px;font-family:inherit;outline:none}
.mi:focus,.fi:focus{border-color:var(--blue);background:#fff}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.sb2{padding:11px;border-radius:9px;background:var(--soft);border:1px solid var(--line2);color:var(--sub);
font-size:13px;font-weight:700;text-align:center;cursor:pointer}
.sb2:active{background:var(--line)}
.sb2.on{background:var(--bbg);border-color:var(--bbd);color:var(--blue3)}
.bfull{padding:12px;border-radius:10px;background:var(--blue);color:#fff;text-align:center;font-size:14px;font-weight:700;cursor:pointer}
.bfull:active{background:var(--blue2)}
.ri{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);cursor:pointer}
.ri:last-child{border-bottom:none}
.ri:active{opacity:.6}
.rn{font-size:14px;font-weight:700}.rp{font-size:11.5px;color:var(--sub);margin-top:2px}
.hs{border-left:2px solid var(--line2);padding-left:13px;margin-left:3px}
.hi{padding:9px 0;border-bottom:1px dashed var(--line)}.hi:last-child{border-bottom:none}
.h1{display:flex;justify-content:space-between;font-size:13.5px;gap:8px;align-items:center}
.h2{font-size:12px;color:var(--sub);margin-top:3px}
.mm{font-size:12px;color:var(--sub);margin-top:5px;background:var(--soft);padding:6px 9px;border-radius:8px;
white-space:pre-wrap;word-break:break-all;border:1px solid var(--line)}
.gt{font-size:10.5px;padding:1.5px 7px;border-radius:20px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ch{font-size:12.5px;padding:6px 12px;border-radius:20px;background:var(--soft);color:var(--sub);
border:1px solid var(--line);cursor:pointer}
.ch.on{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.fl{font-size:12px;color:var(--sub);font-weight:700;margin:11px 0 5px}
.note{background:var(--bbg);border:1px solid var(--bbd);border-radius:8px;padding:8px 10px;
font-size:11.5px;color:var(--blue3);line-height:1.6;margin-top:9px}

<script>
/* ▼ 여기 4자리를 원하는 비밀번호로 바꾸세요 ▼ */
var PIN_CODE = "1440";
/* ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲ */
(function(){
  var buf="", gate=document.getElementById("pinGate"),
      box=document.getElementById("pgDots"),
      dots=box.querySelectorAll(".pgDot");
  function draw(){dots.forEach(function(d,i){d.classList.toggle("on",i<buf.length)});}
  function ok(){gate.classList.add("hide");}          /* 매번 재입력: 상태 저장 안 함 */
  function no(){box.classList.add("err");
    setTimeout(function(){box.classList.remove("err");buf="";draw();},420);}
  function put(n){if(buf.length>=4)return;buf+=n;draw();
    if(buf.length===4)setTimeout(function(){buf===PIN_CODE?ok():no();},110);}
  document.getElementById("pgPad").addEventListener("click",function(e){
    var k=e.target.closest(".pgKey");if(!k)return;var v=k.getAttribute("data-k");
    if(v==="clear"){buf="";draw();}
    else if(v==="back"){buf=buf.slice(0,-1);draw();}
    else put(v);});
  document.addEventListener("keydown",function(e){
    if(gate.classList.contains("hide"))return;
    if(e.key>="0"&&e.key<="9")put(e.key);
    else if(e.key==="Backspace"){buf=buf.slice(0,-1);draw();}});
})();
</script>

function dayMap(){const m={};ROWS.forEach(r=>{const d=kd(r[1]);if(!d)return;(m[d]=m[d]||[]).push(r)});return m}
function monthSum(ym){let s=0,n=0;ROWS.forEach(r=>{if(kd(r[1]).slice(0,7)===ym){const a=amtOf(r);if(a){s+=a;n++}}});return{s:s,n:n}}
const won=v=>v.toLocaleString('ko-KR')+'원';
function fa(v){const s=String(v||'').trim();if(!s)return'';
  const d=s.replace(/[^0-9]/g,'');if(!d)return esc(s);
  return parseInt(d,10).toLocaleString('ko-KR')}
function shiftM(d){let y=CY,m=CM+d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}CY=y;CM=m;SEL='';render()}
function calHTML(){
  if(!CY){const a=TD().split('-');CY=+a[0];CM=+a[1]}
  const ym=CY+'-'+('0'+CM).slice(-2);
  const dm=dayMap(),ms=monthSum(ym);
  const first=new Date(CY,CM-1,1).getDay();
  const dim=new Date(CY,CM,0).getDate();
  const pdim=new Date(CY,CM-1,0).getDate();
  let cells='';
  for(let i=first-1;i>=0;i--)cells+=`<div class="cd o">${pdim-i}</div>`;
  for(let d=1;d<=dim;d++){
    const key=ym+'-'+('0'+d).slice(-2);
    const rs=dm[key]||[];
    const dow=new Date(CY,CM-1,d).getDay();
    const isT=key===TD(),isS=key===SEL;
    const col=dow===0?'style="color:var(--red)"':dow===6?'style="color:var(--blue)"':'';
    let dots='';
    if(rs.length){const k=Math.min(rs.length,3);
      for(let i=0;i<k;i++)dots+=`<span class="dot${isS?' w':''}"></span>`}
    cells+=`<div class="cd${isS?' sel':''}${isT&&!isS?' tdy':''}" onclick="pickDay('${key}')">
      <span ${isS?'':col}>${d}</span><div class="dots">${dots}</div></div>`;
  }
  const rest=(7-((first+dim)%7))%7;
  for(let d=1;d<=rest;d++)cells+=`<div class="cd o">${d}</div>`;
  let det='';
  if(SEL){
    const rs=dm[SEL]||[];
    const tot=rs.reduce((s,r)=>s+amtOf(r),0);
    const ds=SEL.split('-').map(Number),dt=new Date(ds[0],ds[1]-1,ds[2]);
    det=`<div class="cdet"><div class="cdh">
      <span>${CM}월 ${+SEL.slice(-2)}일 (${'일월화수목금토'[dt.getDay()]})</span>
      <span>${rs.length}건${tot?' · <b style="color:var(--blue)">'+won(tot)+'</b>':''}</span></div>
      ${rs.length?rs.map(r=>{const b=BIZ.find(x=>x.ph.indexOf(nrm(r[5]))>=0);
        return `<div class="cdr"${b?` onclick="open2(${b.id})"`:''}>
        <div>${gtag(r[0])}<span style="font-size:13.5px;margin-left:6px">${esc(r[6])}</span></div>
        <span style="font-size:13px;font-weight:700">${r[3]?fa(r[3]):'<span style="color:var(--mute);font-weight:400">—</span>'}</span>
        </div>`}).join(''):'<div style="font-size:13px;color:var(--mute);padding:8px 0">기록이 없습니다.</div>'}
      </div>`;
  }
  return `<div class="pan"><div class="calh">
    <div class="calnav"><span onclick="shiftM(-1)">◀</span>
    <span class="calym">${CY}. ${CM}</span><span onclick="shiftM(1)">▶</span></div>
    <div style="text-align:right"><div style="font-size:10.5px;color:var(--mute)">월 매출</div>
    <div style="font-size:14px;font-weight:800;color:var(--blue)">${won(ms.s)}</div></div></div>
    <div class="cw"><span style="color:var(--red)">일</span><span>월</span><span>화</span>
    <span>수</span><span>목</span><span>금</span><span style="color:var(--blue)">토</span></div>
    <div class="cg">${cells}</div>${det}</div>`;
}

  if(cn)parts.push('전 '+b.nm);
  if(mm)parts.push(mm);
  const cd=(document.getElementById('f_dt').value||'').trim()||TD();
  const rec={bid:b.id,g:g,d:cd,a:'',e:b.exp,n:nn,p:np,m:parts.join(' / ')};
  pl(rec);FORM=null;draw();toast(g+' 완료');
}
function pw(d){const b=byId[CUR];document.getElementById('pwv').textContent=
  `${(b.exp&&b.exp>=TD())?'기존 만료일':'오늘'} 기준 +${d}일 → ${fk(nx(b.exp,d))}`}
function cw(){const p=document.getElementById('pwv');if(p)p.textContent=''}
function go(id){CUR=id;CURP=(byId[id]||{}).cur||'';FORM=null;draw();document.getElementById('sheet').scrollTop=0}
const AMT={30:'100,000',60:'180,000',90:'250,000'};
function selD_on(d){return (PDS.id===CUR&&PDS.days===d)?' sel':''}
function selD(d){ if(PDS.id!==CUR)PDS={id:CUR,days:null,vw:false};
  PDS.days=(PDS.days===d)?null:d; draw(); }
function selVw(){ if(PDS.id!==CUR)PDS={id:CUR,days:null,vw:false};
  PDS.vw=!PDS.vw; draw(); }
function vw_on(){return (PDS.id===CUR&&PDS.vw)?' sel':''}
function saveAll(){
  const b=byId[CUR]; if(!b)return;
  const days=(PDS.id===CUR)?PDS.days:null;
  const rf=(SREF&&SREF.id===CUR)?SREF.nm:'';
  const m=((document.getElementById('memo')||{}).value||'').trim();
  const raw=(((document.getElementById('dbin')||{}).value)||'').trim();
  let dbV=null;
  if(raw!==''){ dbV=dbNum(raw); if(dbV===null)return toast('DB 수량은 숫자만 입력하세요'); }
  const vw=(PDS.id===CUR&&PDS.vw);
  if(days===null&&!rf&&dbV===null&&!m&&!vw)return toast('선택하거나 입력한 내용이 없습니다');
  const parts=[]; if(rf)parts.push(`${rf} 에서 소개`); if(m)parts.push(m);
  const memo=parts.join(' / ');
  let rec=null;
  if(days!==null) rec={bid:b.id,g:curExtG(),d:TD(),a:AMT[days],e:nx(b.exp,days),n:b.nm,p:b.cur,m:memo};
  else if(rf)     rec={bid:b.id,g:'소개등록',d:TD(),a:'',e:b.exp,n:b.nm,p:b.cur,m:memo};
  else if(dbV!==null) rec={bid:b.id,g:'디비기록',d:TD(),a:'',e:'',n:b.nm,p:b.cur,m:memo};
  else if(m)      rec={bid:b.id,g:'메모',d:TD(),a:'',e:'',n:b.nm,p:b.cur,m:memo};
  if(rec&&dbV!==null) rec.nb=Object.assign({},rec.nb||{},{db:String(dbV)});
  const list=[];
  if(rec)list.push(rec);
  if(vw){const vr={bid:b.id,g:'조회수',d:TD(),a:'50,000',e:b.exp,n:b.nm,p:b.cur,m:'조회수 10회 추가'};
    if(!rec&&dbV!==null)vr.nb={db:String(dbV)};
    list.push(vr)}
  PDS={id:null,days:null,vw:false}; SREF=null; PICK=null;
  list.forEach(x=>pl(x)); draw();
  toast(days!==null?`${list[0].g} ${days}일 → ${fk(list[0].e)} 저장됨${vw?' · 조회수 추가':''}`
    :(vw?'조회수 10회 추가 저장됨':'저장됨'));
}
function ext(d){const b=byId[CUR],e=nx(b.exp,d),m=(document.getElementById('memo').value||'').trim();
  const gg=curExtG();ap({bid:b.id,g:gg,d:TD(),a:AMT[d],e:e,n:b.nm,p:b.cur,m:m});toast(`${gg} ${d}일 → ${fk(e)}`)}
function bonus(){const b=byId[CUR],e=nx(b.exp,10);
  ap({bid:b.id,g:'소개서비스',d:TD(),a:'',e:e,n:b.nm,p:b.cur,m:'소개서비스 10일 추가',bn:'10'});
  toast(`소개 서비스 10일 → ${fk(e)}`)}
function p2d(n){return('0'+n).slice(-2)}
function addD(ds,n){const a=(ds||'').split('-').map(Number);
  if(!a[0])return nx('',n);
  const t=new Date(a[0],a[1]-1,a[2]+ (+n));return ymd(t)}
function ymd(t){return t.getFullYear()+'-'+p2d(t.getMonth()+1)+'-'+p2d(t.getDate())}
function pmEnd(){const a=TD().split('-').map(Number);return ymd(new Date(a[0],a[1]-1,0))}
function dayBefore(ds){const a=ds.split('-').map(Number);
  if(!a[0]||a[0]<1900)return '0000-01-01';
  return ymd(new Date(a[0],a[1]-1,a[2]-1))}
function dbNum(v){const n=parseInt(String(v).replace(/[^0-9-]/g,''),10);return isNaN(n)?null:n}
function evDb(b){return [...(b.ev||[])].filter(e=>e.d&&String(e.db||'').trim()!=='')
  .sort((x,y)=>(x.d||'').localeCompare(y.d||''))
  .map(e=>({d:e.d,v:dbNum(e.db)})).filter(x=>x.v!==null)}
function dbAsOf(b,ds){let v=null;evDb(b).forEach(x=>{if(x.d<=ds)v=x.v});return v}
function dbNow(b){const h=evDb(b);return h.length?h[h.length-1].v:null}
function dbLastD(b){const h=evDb(b);return h.length?h[h.length-1].d:''}
function dbTotalAsOf(ds){let s=0;BIZ.forEach(b=>{const v=dbAsOf(b,ds);if(v!==null)s+=v});return s}
function isWarn(g){return /^경고/.test(String(g||''))}
function isDbRec(g){return /^디비기록/.test(String(g||''))}
function warnN(b){return (b.ev||[]).filter(e=>isWarn(e.g)).length}
function lastWarnSr(b){const w=(b.ev||[]).filter(e=>isWarn(e.g))
  .sort((x,y)=>(x.d||'').localeCompare(y.d||''));return w.length?w[w.length-1].sr:0}
let EXR=null,WCONF=false;
function isExp(b){return !!(b.exp&&b.exp<TD())}
function curExtG(){const b=byId[CUR];if(!b)return '연장';
  if(EXR&&EXR.id===CUR)return EXR.v==='r'?'연장복귀':'연장';
  return isExp(b)?'연장복귀':'연장'}
function setExt(v){EXR={id:CUR,v:v};draw()}
function togWc(){WCONF=!WCONF;draw()}
function recDb(){const b=byId[CUR];if(!b)return;
  const el=document.getElementById('dbin');const raw=((el&&el.value)||'').trim();
  if(raw==='')return toast('DB 수량을 입력하세요');
  const v=dbNum(raw);if(v===null)return toast('숫자만 입력하세요');
  ap({bid:b.id,g:'디비기록',d:TD(),a:'',e:'',n:b.nm,p:b.cur,m:'',nb:{db:String(v)}});
  toast(`DB ${v.toLocaleString('ko-KR')}개 기록됨`)}
function addWarn(){const b=byId[CUR];if(!b)return;const n=warnN(b);
  ap({bid:b.id,g:'경고',d:TD(),a:'',e:'',n:b.nm,p:b.cur,m:`DB 저장 안내 ${n+1}회`});
  toast(`경고 ${n+1}회 기록됨`)}
function delWarn(){const b=byId[CUR];if(!b)return;const sr=lastWarnSr(b);
  WCONF=false;if(!sr){draw();return toast('새로고침 후 취소할 수 있습니다')}doDel(sr)}
function ap(r){pl(r);draw()}
function pauseDays(p){const n=dd(p.d,TD());return Math.max(0,(n||0)-1)}
function lastPause(b){
  let p=null;
  [...b.ev].sort((x,y)=>(x.d||'').localeCompare(y.d||'')).forEach(e=>{
    const g=e.g||'';
    if(/일시\s*(정지|중지)/.test(g)&&!/복귀|해지|해제|off/i.test(g))p=e;
    else if(/복귀|해지|해제|off/i.test(g)&&p)p=null;
  });
  return p;
}
function togPz(){const b=byId[CUR];if(lastPause(b))return toast('이미 일시정지 상태입니다');
  PZ=!PZ;RZ=false;draw();if(PZ)setTimeout(pzPv,10)}
function pzPv(){
  const b=byId[CUR],el=document.getElementById('pzd');if(!el)return;
  const d=el.value||TD();
  const rem=b.exp?dd(d,b.exp):null;
  const p=document.getElementById('pzp');
  if(p)p.textContent=rem===null?'만료일 정보 없음'
    :rem<0?`${fk(d)} 기준 이미 ${-rem}일 만료됨`
    :`${fk(d)} 정지 · 잔여 ${rem}일 보관 (만료 ${fk(b.exp)})`;
}
function rzDate(){
  const b=byId[CUR],p=lastPause(b),el=document.getElementById('rzdt'),n=document.getElementById('rzd');
  if(!p||!el||!n)return;
  const g=dd(p.d,el.value||TD());
  n.value=Math.max(0,(g||0)-1);rzPv();
}
function togRz(){const b=byId[CUR];if(!lastPause(b))return toast('일시정지 상태가 아닙니다');
  RZ=!RZ;PZ=false;draw();if(RZ)setTimeout(rzPv,10)}
function rzPv(){
  const b=byId[CUR],el=document.getElementById('rzd');if(!el)return;
  const n=parseInt((el.value||'').replace(/\D/g,''),10)||0;
  const ne=addD(b.exp||TD(),n);
  const p=document.getElementById('rzp');
  if(p)p.textContent=`${fk(b.exp)} + ${n}일 → ${fk(ne)}`;
}
function pause(){
  const b=byId[CUR];
  if(lastPause(b))return toast('이미 일시정지 상태입니다');
  const el=document.getElementById('pzd');
  const pd=(el&&el.value)?el.value:TD();
  const rem=b.exp?dd(pd,b.exp):null;
  const m=(document.getElementById('memo').value||'').trim();
  const note=['일시정지'+(rem!==null?` (잔여 ${rem}일)`:''),m].filter(Boolean).join(' / ');
  PZ=false;
  ap({bid:b.id,g:'일시정지',d:pd,a:'',e:b.exp,n:b.nm,p:b.cur,m:note});
  toast(rem!==null?`${fk(pd)} 정지 · 잔여 ${rem}일`:'일시정지');
}
function resume(){
  const b=byId[CUR];
  const p=lastPause(b);
  if(!p)return toast('일시정지 상태가 아닙니다');
  const el=document.getElementById('rzd'),dt=document.getElementById('rzdt');
  const rd=(dt&&dt.value)?dt.value:TD();
  const days=el?(parseInt((el.value||'').replace(/\D/g,''),10)||0):pauseDays(p);
  const base=b.exp||TD();
  const ne=addD(base,days||0);
  const m=(document.getElementById('memo').value||'').trim();
  const note=[`복귀 (${days}일 추가)`,m].filter(Boolean).join(' / ');
  RZ=false;
  ap({bid:b.id,g:'일시정지복귀',d:rd,a:'',e:ne,n:b.nm,p:b.cur,m:note});
  toast(`복귀 · ${days}일 추가 → ${fk(ne)}`);
}
function addRef(){
  const b=byId[CUR];
  if(!PICK)return toast('목록에서 소개자를 선택하세요');
  if(PICK.t==='bz'&&PICK.id===b.id)return toast('자기 자신은 선택할 수 없습니다');
  const isAg=PICK.t==='ag';
  SREF={id:b.id,nm:PICK.nm};
  PICK=null;draw();
  toast((isAg?'외부 소개자':'소개자')+' 선택됨 — 아래 [정보 저장]을 누르세요');
}
let NR='',NB='',NP=30,NPC=false;
function openNew(pre){
  CUR=null;NR='';NB='';NP=30;NPC=false;
  document.getElementById('sheet').innerHTML=`
  <div class="shd"><div><div class="n2">신규 업체 등록</div>
  <div class="s2">등록 후 바로 연장 처리됩니다</div></div><button class="x" onclick="close2()">✕</button></div>
  <div class="sb">
  <div class="note" style="margin:0 0 10px;color:var(--red)">
  이미 등록된 업체가 번호만 바꾼 경우에는 여기가 아니라,
  기존 업체를 열어 <b>번호변경</b>으로 기록하세요. (여기서 넣으면 업체가 둘로 나뉩니다)</div>
  <div class="fl">업소 연락처 *</div><input class="fi" id="nph" type="tel" placeholder="뒷 8자리만 입력해도 됩니다"
   value="${pre?pre:''}" oninput="pfmtLive(this)" onblur="pfmtBlur(this)">
  <div class="fl">상호명 *</div><input class="fi" id="nnm" placeholder="상호명">
  <div class="fl">지역</div><div class="chips" id="cr">${REG.map(r=>`<span class="ch" onclick="pR('${r}')">${r}</span>`).join('')}</div>
  <div class="fl">업종</div><div class="chips" id="cb">${BZ.map(r=>`<span class="ch" onclick="pB('${r}')">${r}</span>`).join('')}</div>
  <div class="fl">디비갯수</div><input class="fi" id="ndb" type="tel" placeholder="숫자">
  <div class="fl">소개해준 곳 (선택)</div>
  <input class="fi" id="nrf" placeholder="번호 뒷자리 · 상호명 · 소개자 이름" autocomplete="off" oninput="sug('nrf','nsug')">
  <div id="nsug"></div>
  <div class="fl">비고</div><textarea class="mi" id="nmm" rows="2" placeholder="메모"></textarea>
  <div class="fl">등록일</div><input class="fi" id="ndt" type="date" value="${TD()}" onchange="pP(NP)">
  <div class="fl">시작 기간 *</div><div class="chips" id="cp">
  ${[30,60,90].map(d=>`<span class="ch${d===30?' on':''}" onclick="pP(${d})">${d}일 ${d===30?'10만':d===60?'18만':'25만'}</span>`).join('')}</div>
  <div id="ncw" style="display:none">
  <div class="fl">만료일 직접 지정 *</div>
  <input class="fi" id="nex" type="date" value="${TD()}" onchange="pP('c')">
  <div class="fl">금액 (선택)</div>
  <input class="fi" id="nam" type="tel" placeholder="비워두면 매출에 잡히지 않습니다">
  </div>
  <div class="pw" id="npv"></div>
  <div class="bfull" onclick="saveNew()">등록하기</div></div>`;
  pP(30);openMask();
}
function pR(v){NR=NR===v?'':v;document.getElementById('cr').innerHTML=REG.map(r=>`<span class="ch${r===NR?' on':''}" onclick="pR('${r}')">${r}</span>`).join('')}
function pB(v){NB=NB===v?'':v;document.getElementById('cb').innerHTML=BZ.map(r=>`<span class="ch${r===NB?' on':''}" onclick="pB('${r}')">${r}</span>`).join('')}
function pP(d){
  NPC=(d==='c');if(!NPC)NP=d;
  document.getElementById('cp').innerHTML=
    [30,60,90].map(x=>`<span class="ch${(!NPC&&x===NP)?' on':''}" onclick="pP(${x})">${x}일 ${x===30?'10만':x===60?'18만':'25만'}</span>`).join('')
    +`<span class="ch${NPC?' on':''}" onclick="pP('c')">직접</span>`;
  const w=document.getElementById('ncw');if(w)w.style.display=NPC?'block':'none';
  const de=document.getElementById('ndt'),bd=(de&&de.value)||TD();
  const ne=document.getElementById('nex'),ex=(ne&&ne.value)||TD();
  document.getElementById('npv').textContent= NPC
    ? `만료일 ${fk(ex)} 로 등록됩니다`
    : `${bd===TD()?'오늘':fk(bd)} 기준 +${NP}일 → ${fk(addD(bd,NP))}`}
function saveNew(){
  const g=i=>(document.getElementById(i).value||'').trim();
  const p=g('nph').replace(/\D/g,''),nm=g('nnm');
  if(p.length<10)return toast('연락처를 확인하세요');
  if(!nm)return toast('상호명을 입력하세요');
  if(BIZ.some(b=>b.ph.includes(p))&&!(window.CUTS&&window.CUTS[p]))return toast('이미 등록된 번호입니다');
  const bd=g('ndt')||TD();
  let e,amt;
  if(NPC){e=g('nex');if(!e)return toast('만료일을 지정하세요');
    const rawA=g('nam').replace(/[^0-9]/g,'');
    amt=rawA?(+rawA).toLocaleString('ko-KR'):'';}
  else{e=addD(bd,NP);amt=AMT[NP]}
  const id=0;
  let rf='';
  if(PICK)rf=PICK.nm;
  const m=[g('nmm'),rf?`${rf} 에서 소개`:''].filter(Boolean).join(' / ');
  const rec={bid:id,g:'신규',d:bd,a:amt,e:e,n:nm,p:p,m:m,nb:{rg:NR,bz:NB,db:g('ndb')}};
  CURP=p;pl(rec);
  const nb2=BIZ.find(x=>x.ph.indexOf(p)>=0);
  toast(`${nm} 등록 완료`);if(nb2)open2(nb2.id);else close2();
}
function toast(m){const t=document.getElementById('tst');t.textContent=m;t.classList.add('on');
  clearTimeout(window._t);window._t=setTimeout(()=>t.classList.remove('on'),2400)}
init();
</script>
</body>
