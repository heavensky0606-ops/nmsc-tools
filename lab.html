<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연구소설립 진단 v2 | NMSC 컨설팅 바이블</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#0A84FF; --blue-d:#0062cc; --blue-l:#e8f2ff;
  --red:#e8202a; --red-l:#ffeaeb;
  --ink:#111; --gray:#666; --line:#e5e5e5; --bg:#f5f7fa;
  --green:#1a9d55; --green-l:#e6f7ee; --amber:#c77700; --amber-l:#fff4e0;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-weight:500}
.wrap{max-width:860px;margin:0 auto;padding:16px}

.hd{background:var(--blue);color:#fff;border-radius:16px;padding:24px 22px;margin-bottom:14px}
.hd h1{font-size:22px;font-weight:900;letter-spacing:-.5px}
.hd .sub{font-size:13px;font-weight:700;opacity:.95;margin-top:6px}
.hd .law{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);display:inline-block;padding:4px 10px;border-radius:20px;margin-top:10px}

.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:13px;font-weight:900;cursor:pointer;text-align:center;transition:.12s}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.prog{display:flex;gap:6px;margin-bottom:16px}
.prog .p{flex:1;height:6px;border-radius:6px;background:var(--line)}
.prog .p.on{background:var(--blue)}
.prog .p.done{background:var(--green)}

.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.step-tag{display:inline-block;font-size:11px;font-weight:900;color:var(--blue);background:var(--blue-l);padding:4px 12px;border-radius:20px;margin-bottom:12px}
.card h2{font-size:18px;font-weight:900;letter-spacing:-.4px;margin-bottom:4px}
.card .desc{font-size:13px;font-weight:600;color:var(--gray);margin-bottom:18px}

.q{margin-bottom:20px}
.q .label{font-size:14px;font-weight:900;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.q .hint{font-size:12px;font-weight:600;color:var(--gray);margin-bottom:10px;background:var(--bg);padding:8px 12px;border-radius:8px;border-left:3px solid var(--blue)}
.req{color:var(--red);font-size:11px;font-weight:900}

.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:.12s;background:#fff;text-align:left;display:flex;flex-direction:column;gap:3px}
.opt small{font-size:11px;font-weight:600;color:var(--gray)}
.opt:hover{border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.opt.sel small{color:var(--blue-d)}

.chk{border:2px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;transition:.12s;display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.chk:hover{border-color:var(--blue)}
.chk.sel{border-color:var(--blue);background:var(--blue-l)}
.chk .box{width:22px;height:22px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;font-weight:900;margin-top:1px}
.chk.sel .box{background:var(--blue);border-color:var(--blue)}
.chk .txt{font-size:13.5px;font-weight:700}
.chk .txt small{display:block;font-size:11.5px;font-weight:600;color:var(--gray);margin-top:2px}

.researcher{border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;position:relative}
.researcher .rnum{position:absolute;top:-10px;left:12px;background:var(--blue);color:#fff;font-size:11px;font-weight:900;padding:2px 10px;border-radius:20px}
.researcher .del{position:absolute;top:10px;right:12px;background:var(--red-l);color:var(--red);border:none;border-radius:8px;padding:4px 10px;font-size:11px;font-weight:900;cursor:pointer}
.researcher input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-weight:600;margin-bottom:8px;font-family:inherit}
.researcher input:focus{outline:none;border-color:var(--blue)}
.rq-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rsel{border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;font-weight:700;cursor:pointer;background:#fff}
.rsel.sel{border-color:var(--blue);background:var(--blue-l);color:var(--blue-d)}
.rverdict{margin-top:10px;font-size:12px;font-weight:800;padding:8px 12px;border-radius:8px}
.rverdict.ok{background:var(--green-l);color:var(--green)}
.rverdict.no{background:var(--red-l);color:var(--red)}
.rverdict.maybe{background:var(--amber-l);color:var(--amber)}
.rrole{margin-top:6px;font-size:11.5px;font-weight:800;padding:6px 10px;border-radius:8px;background:var(--blue-l);color:var(--blue-d)}
.add-r{width:100%;border:2px dashed var(--blue);color:var(--blue);background:var(--blue-l);border-radius:12px;padding:13px;font-size:14px;font-weight:900;cursor:pointer;margin-bottom:10px}

.nav{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;transition:.12s}
.btn.next{background:var(--blue);color:#fff}
.btn.next:hover{background:var(--blue-d)}
.btn.next:disabled{background:var(--line);color:#999;cursor:not-allowed}
.btn.prev{background:#fff;color:var(--ink);border:2px solid var(--line);flex:0 0 90px}
.btn.big{background:var(--red);color:#fff;font-size:16px}
.btn.big:hover{background:#c41820}

.result-hd{border-radius:16px;padding:26px 22px;text-align:center;margin-bottom:14px;color:#fff}
.result-hd.ok{background:var(--green)}
.result-hd.maybe{background:var(--amber)}
.result-hd.no{background:var(--red)}
.result-hd .big{font-size:26px;font-weight:900;letter-spacing:-.5px}
.result-hd .small{font-size:13px;font-weight:700;opacity:.95;margin-top:6px}
.result-hd .badge{display:inline-block;background:rgba(255,255,255,.22);font-size:12px;font-weight:900;padding:5px 14px;border-radius:20px;margin-top:12px}

.rsec{background:#fff;border-radius:14px;padding:20px;margin-bottom:12px}
.rsec h3{font-size:15px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px;letter-spacing:-.3px}
.rsec h3 .ic{width:26px;height:26px;background:var(--blue-l);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:700}
.check-row:last-child{border-bottom:none}
.check-row .st{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff}
.st.ok{background:var(--green)}.st.no{background:var(--red)}.st.warn{background:var(--amber)}
.check-row .ct small{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-top:2px}

.benefit{background:var(--blue-l);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.benefit .bt{font-size:14px;font-weight:900;color:var(--blue-d);margin-bottom:3px}
.benefit .bd{font-size:12.5px;font-weight:600;color:#333}

.guide-step{display:flex;gap:12px;margin-bottom:14px}
.guide-step .gn{flex-shrink:0;width:30px;height:30px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.guide-step .gt{font-size:13.5px;font-weight:800}
.guide-step .gt small{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-top:2px}

.tab-panel{background:var(--bg);border-radius:10px;padding:14px;margin:8px 0}
.tab-panel .tp-h{font-size:13px;font-weight:900;color:var(--blue-d);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.tab-panel ul{list-style:none;font-size:12.5px;font-weight:600}
.tab-panel li{padding:5px 0 5px 20px;position:relative}
.tab-panel li:before{content:"▸";position:absolute;left:4px;color:var(--blue)}

.docs-list{list-style:none}
.docs-list li{font-size:13px;font-weight:700;padding:8px 0 8px 24px;position:relative;border-bottom:1px solid var(--line)}
.docs-list li:before{content:"📄";position:absolute;left:0}
.docs-list li:last-child{border-bottom:none}
.docs-list li small{color:var(--gray);font-weight:600}
.docs-list li.online:before{content:"⌨️"}

.pitch{background:#1a1a1a;color:#eee;border-radius:12px;padding:16px;font-size:13px;font-weight:600;line-height:1.7;white-space:pre-wrap}
.pitch .ptag{color:var(--blue);font-weight:900;font-size:11px;display:block;margin-bottom:8px}

.warn-box{background:var(--red-l);border:1.5px solid var(--red);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--red)}
.warn-box .wt{font-weight:900;margin-bottom:4px}
.tip-box{background:var(--green-l);border:1.5px solid var(--green);border-radius:12px;padding:14px 16px;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--green)}
.tip-box .wt{font-weight:900;margin-bottom:4px}

.summary-num{display:flex;gap:8px;margin-bottom:14px}
.snum{flex:1;background:var(--bg);border-radius:12px;padding:14px 10px;text-align:center}
.snum .n{font-size:24px;font-weight:900;color:var(--blue)}
.snum .n.red{color:var(--red)}
.snum .n.green{color:var(--green)}
.snum .l{font-size:11px;font-weight:700;color:var(--gray);margin-top:2px}

.case-hero{background:linear-gradient(135deg,var(--green),#0d7a40);color:#fff;border-radius:14px;padding:22px;margin-bottom:12px}
.case-hero .ch-tag{font-size:11px;font-weight:900;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:10px}
.case-hero h3{font-size:19px;font-weight:900;letter-spacing:-.4px}
.case-hero .ch-sub{font-size:13px;font-weight:700;opacity:.95;margin-top:4px}
.ctable{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0}
.ctable td{padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600}
.ctable td:first-child{font-weight:900;color:var(--gray);width:34%;background:var(--bg)}
.timeline{position:relative;padding-left:26px}
.timeline:before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:14px}
.tl-item:before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--blue);border:2px solid #fff}
.tl-item.done:before{background:var(--green)}
.tl-date{font-size:11px;font-weight:900;color:var(--blue-d)}
.tl-txt{font-size:13px;font-weight:700}
.tl-txt small{display:block;font-size:11.5px;font-weight:600;color:var(--gray);margin-top:1px}

.foot{text-align:center;font-size:11px;font-weight:600;color:var(--gray);padding:16px 0 30px}
@media print{.no-print{display:none!important}body{background:#fff}.card,.rsec{box-shadow:none;border:1px solid #ddd}}
@media(max-width:520px){.rq-grid{grid-template-columns:1fr}.tab{font-size:11px;padding:9px 4px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd no-print">
    <h1>🔬 연구소설립 진단 <span style="font-size:13px;opacity:.85">v2</span></h1>
    <div class="sub">기업부설연구소 · 연구개발전담부서 설립 진단 + KOITA 온라인 신청 가이드</div>
    <div class="law">2026.2.1 시행 신법 · 외국인 연구원 · 서비스분야 우회 판정 지원</div>
  </div>

  <div class="tabs no-print">
    <div class="tab on" id="tab-diag" onclick="switchTab('diag')">📋 진단하기</div>
    <div class="tab" id="tab-case" onclick="switchTab('case')">🏆 실제 성공사례</div>
  </div>

  <div class="prog no-print" id="prog"></div>
  <div id="app"></div>

  <div class="foot">NMSC 나이스경영지원센터 · 컨설팅 바이블 · 신고기관: 한국산업기술진흥협회(KOITA) rnd.or.kr<br>※ 본 진단은 참고용이며 최종 인정은 KOITA 심사에 따릅니다</div>
</div>

<script>
const S = {
  view:'diag', step:0,
  company:{ size:null, industry:null, special:null, founded:null },
  researchers:[], space:[], intent:null
};
const STEPS = ["기업정보","연구전담요원","연구공간","진단결과"];

function minRequired(){
  const {size,special,founded} = S.company;
  if(S.intent==='dept') return {n:1, label:'연구개발전담부서'};
  if(special==='venture'||special==='prof') return {n:2, label:'벤처/연구원·교원 창업기업 특례'};
  if(size==='small'){
    if(founded==='under3') return {n:2, label:'소기업(창업 3년 이내 완화)'};
    return {n:3, label:'소기업'};
  }
  if(size==='mid'){
    if(founded==='small2mid') return {n:3, label:'소→중기업 전환 1년 이내 완화'};
    return {n:5, label:'중기업'};
  }
  if(size==='midlarge') return {n:7, label:'중견기업'};
  if(size==='large') return {n:10, label:'대기업'};
  return {n:3, label:'-'};
}

function foreignerOK(visa){
  const okVisa = ['f2','f4','f5','f6'];
  const noVisa = ['trainee','short'];
  if(visa==='domestic'||!visa) return {ok:true, note:''};
  if(okVisa.includes(visa)) return {ok:true, note:'취업 제한 없는 체류자격 → 4대보험 가입 시 인정'};
  if(visa==='e7') return {ok:true, note:'E-7(특정활동) → 해당 직무 취업허가 범위 내 인정, 4대보험 필수'};
  if(noVisa.includes(visa)) return {ok:false, note:'산업연수생·단기체류(6개월↓)는 연구전담요원 등록 불가'};
  return {ok:true, note:''};
}

function judgeResearcher(r){
  const isService = S.company.industry==='service';
  const isSME = (S.company.size==='small'||S.company.size==='mid');
  const f = foreignerOK(r.visa);
  if(!f.ok) return {v:'no', role:'불가', msg:'❌ '+f.note};
  if(r.insured==='no') return {v:'no', role:'불가', msg:'❌ 4대보험 직원 증명 불가 → 등록 불가'};
  if(r.conflict==='yes') return {v:'no', role:'불가', msg:'❌ 대표·감사·비상임이사 또는 타업무 겸직 → 등록 불가 (창업3년내 소기업 대표는 예외)'};
  if(r.degree==='natural_bachelor') return {v:'ok', role:'전담요원', msg:'✅ 자연계(자연과학·공학·의학) 학사 이상 → 업종 불문 무조건 인정'+(f.note?' / '+f.note:'')};
  if(r.cert==='gisa') return {v:'ok', role:'전담요원', msg:'✅ 국가기술자격 기사 이상 → 업종 불문 무조건 인정'};
  if(isService){
    if(r.degree==='other_bachelor') return {v:'ok', role:'전담요원', msg:'✅ 서비스·산업디자인 분야 → 자연계 아니어도 학사 인정 (분야 프레이밍 필수)'};
    if(r.cert==='service2') return {v:'ok', role:'전담요원', msg:'✅ 서비스분야 2급 + 연구경력 2년 → 인정'};
  }
  if(isSME){
    if(r.cert==='sanuptech') return {v:'maybe', role:'전담요원(조건부)', msg:'⚠️ 산업기사 → 연구경력 2년 이상이면 인정(중소기업 특례)'};
    if(r.degree==='assoc') return {v:'maybe', role:'전담요원(조건부)', msg:'⚠️ 전문학사 → 연구경력 2년 이상이면 인정(3년제는 1년)'};
    if(r.cert==='gineungsa') return {v:'maybe', role:'전담요원(조건부)', msg:'⚠️ 기능사 → 연구경력 4년 이상이면 인정'};
    if(r.degree==='highschool') return {v:'maybe', role:'전담요원(조건부)', msg:'⚠️ 마이스터고·특성화고졸 → 연구경력 4년 이상이면 인정'};
  }
  return {v:'no', role:'보조원 배치 권장', msg:'❌ 전담요원 자격은 부족하지만, 4대보험 직원이면 <b>연구보조원</b>으로 배치 가능(자격요건 없음, 전담요원 수엔 미포함)'};
}

function countQualified(){
  let ok=0, maybe=0, aux=0;
  S.researchers.forEach(r=>{
    const j = judgeResearcher(r);
    if(j.v==='ok') ok++;
    else if(j.v==='maybe') maybe++;
    else if(j.role==='보조원 배치 권장') aux++;
  });
  return {ok, maybe, aux, total:ok+maybe};
}

function renderProg(){
  const p = document.getElementById('prog');
  if(S.view!=='diag'){ p.style.display='none'; return; }
  p.style.display='flex';
  p.innerHTML = STEPS.map((_,i)=>{
    let c='p';
    if(i<S.step) c+=' done'; else if(i===S.step) c+=' on';
    return `<div class="${c}"></div>`;
  }).join('');
}
function switchTab(v){
  S.view=v;
  document.getElementById('tab-diag').className='tab'+(v==='diag'?' on':'');
  document.getElementById('tab-case').className='tab'+(v==='case'?' on':'');
  render();
}
function render(){
  renderProg();
  const app = document.getElementById('app');
  if(S.view==='case'){ app.innerHTML = caseStudy(); window.scrollTo(0,0); return; }
  if(S.step===0) app.innerHTML = stepCompany();
  else if(S.step===1) app.innerHTML = stepResearchers();
  else if(S.step===2) app.innerHTML = stepSpace();
  else if(S.step===3) app.innerHTML = stepResult();
  window.scrollTo(0,0);
}

function stepCompany(){
  return `
  <div class="card">
    <span class="step-tag">STEP 1 / 4</span>
    <h2>기업 기본정보</h2>
    <p class="desc">기업 규모·업종에 따라 필요한 연구전담요원 최소 인원이 달라집니다</p>
    <div class="q">
      <div class="label">① 설립 유형 <span class="req">필수</span></div>
      <div class="hint">전담부서는 1명으로 설립 가능(초기 진입점). 연구소는 부동산 지방세 감면·국가R&D 직접참여·병역특례 등 혜택이 더 큼</div>
      <div class="opts two">
        <div class="opt ${S.intent==='lab'?'sel':''}" onclick="setIntent('lab')">🏢 기업부설연구소<small>혜택 최대 · 인원요건 높음</small></div>
        <div class="opt ${S.intent==='dept'?'sel':''}" onclick="setIntent('dept')">📋 연구개발전담부서<small>1명 설립 가능 · 세액공제O</small></div>
      </div>
    </div>
    <div class="q">
      <div class="label">② 기업 규모 <span class="req">필수</span></div>

function toggleSpace(id){
  const i = S.space.indexOf(id);
  if(i>=0) S.space.splice(i,1); else S.space.push(id);
  render();
}

function stepResult(){
  const req = minRequired();
  const cnt = countQualified();
  const spaceOK = S.space.length===SPACE_ITEMS.length;
  const spaceMissing = SPACE_ITEMS.filter(it=>!S.space.includes(it.id));
  const peopleOK = cnt.ok >= req.n;
  const peopleMaybe = (cnt.ok+cnt.maybe) >= req.n && !peopleOK;
  const hasForeigner = S.researchers.some(r=>r.visa && r.visa!=='domestic');

  let verdict, vClass, vMsg;
  if(peopleOK && spaceOK){
    verdict='설립 가능'; vClass='ok';
    vMsg='인력·공간 요건을 모두 충족합니다. KOITA 온라인 신청을 진행하세요.';
  } else if((peopleOK||peopleMaybe) && S.space.length>=5){
    verdict='조건부 가능'; vClass='maybe';
    vMsg='일부 요건 보완 시 설립 가능합니다. 아래 보완사항을 확인하세요.';
  } else {
    verdict='요건 미충족'; vClass='no';
    vMsg='현재 요건이 부족합니다. 아래 진단을 바탕으로 인력·공간을 보완하세요.';
  }
  const labelType = S.intent==='dept'?'연구개발전담부서':'기업부설연구소';

  return `
  <div class="result-hd ${vClass}">
    <div class="big">${verdict}</div>
    <div class="small">${labelType} · ${req.label}</div>
    <div class="badge">${vMsg}</div>
  </div>
  <div class="rsec">
    <div class="summary-num">
      <div class="snum"><div class="n ${peopleOK?'green':'red'}">${cnt.ok}<span style="font-size:14px">/${req.n}</span></div><div class="l">전담요원 확정</div></div>
      <div class="snum"><div class="n" style="color:var(--amber)">${cnt.maybe}</div><div class="l">조건부(경력)</div></div>
      <div class="snum"><div class="n" style="color:var(--blue)">${cnt.aux}</div><div class="l">보조원 배치</div></div>
      <div class="snum"><div class="n ${spaceOK?'green':'red'}">${S.space.length}<span style="font-size:14px">/${SPACE_ITEMS.length}</span></div><div class="l">공간 요건</div></div>
    </div>
  </div>
  <div class="rsec">
    <h3><span class="ic">👥</span> 인력 요건 진단</h3>
    <div class="check-row">
      <div class="st ${peopleOK?'ok':peopleMaybe?'warn':'no'}">${peopleOK?'✓':peopleMaybe?'!':'✕'}</div>
      <div class="ct">필요 전담요원 ${req.n}명 중 확정 ${cnt.ok}명${cnt.maybe>0?` + 조건부 ${cnt.maybe}명`:''}
      <small>${peopleOK?'전담요원 인원 충족'+(cnt.aux>0?` (보조원 ${cnt.aux}명 별도)`:''):peopleMaybe?'조건부 인원 포함 시 충족 가능(연구경력 증빙 필요)':`전담요원 ${req.n-cnt.ok-cnt.maybe}명 이상 추가 확보 필요`}</small></div>
    </div>
    ${S.researchers.map((r,i)=>{
      const j=judgeResearcher(r);
      return `<div class="check-row">
        <div class="st ${j.v==='ok'?'ok':j.v==='maybe'?'warn':'no'}">${j.v==='ok'?'✓':j.v==='maybe'?'!':'✕'}</div>
        <div class="ct">후보 ${i+1}${r.name?` (${r.name})`:''} → <b>${j.role}</b><small>${j.msg}</small></div>
      </div>`;
    }).join('')}
    ${hasForeigner?`<div class="tip-box" style="margin-top:12px"><div class="wt">🌏 외국인 연구원 확인사항</div>영주(F-5)·재외동포(F-4)·거주(F-2)·결혼이민(F-6)은 취업 제한이 없어 4대보험 가입 시 정상 인정됩니다. 신청서 주민등록번호란에 <b>외국인등록번호</b>를 기재하고, 졸업증명서가 외국 대학이면 아포스티유/영사확인이 필요할 수 있습니다.</div>`:''}
  </div>
  <div class="rsec">
    <h3><span class="ic">🏢</span> 연구공간 요건 진단</h3>
    ${SPACE_ITEMS.map(it=>{
      const has=S.space.includes(it.id);
      return `<div class="check-row">
        <div class="st ${has?'ok':'no'}">${has?'✓':'✕'}</div>
        <div class="ct">${it.t}<small>${has?'충족':'미충족 — '+it.s}</small></div>
      </div>`;
    }).join('')}
  </div>
  ${(!peopleOK||!spaceOK)?`
  <div class="rsec">
    <h3><span class="ic">🔧</span> 보완 액션 플랜</h3>
    ${!peopleOK?`<div class="warn-box"><div class="wt">인력 보완</div>

      <li>비치서류 <small>인정 후 연구소 내 상시 비치(16p)</small></li>
      <li>사진 <small>현판·내부 실사 이미지</small></li>
    </ul>
  </div>
  <div class="nav no-print">
    <button class="btn" style="background:var(--blue);color:#fff;flex:1" onclick="switchTab('diag')">📋 진단하러 가기</button>
    <button class="btn next" onclick="window.print()">🖨️ 사례 인쇄/PDF</button>
  </div>`;
}

function go(step){
  if(step===1 && !canNext0()){ alert('설립 유형·기업 규모·신청 분야를 선택해 주세요'); return; }
  S.step=step; render();
}
function resetAll(){
  S.step=0; S.company={size:null,industry:null,special:null,founded:null};
  S.researchers=[]; S.space=[]; S.intent=null;
  render();
}
render();
</script>
