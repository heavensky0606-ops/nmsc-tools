    <div class="cr-hint" style="margin-bottom:10px">사진을 받아서 올린 뒤 위 <b>[노트 생성]</b>을 누르면, 이 장면 목록과 사진이 그대로 반영된 ${docName}가 만들어집니다.</div>
    <div style="border:1.5px solid var(--line);border-radius:10px;padding:11px;margin-bottom:10px;background:#f7f9fc">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div style="font-size:12.5px;font-weight:900;color:var(--blue-d)">촬영 장면 ${list.length}개 <span style="font-weight:700;font-size:11px;color:var(--gray)">— 문장을 눌러 바로 고칠 수 있습니다</span></div>
        <div style="font-size:11.5px;font-weight:800;color:${noPhotoN?'var(--red)':'var(--gray)'}">사진 ${photos.length}장 올림${noPhotoN?' · 사진 없는 장면 '+noPhotoN+'개':''}</div>
      </div>
      ${rows}
      <div style="display:flex;gap:8px;margin-top:11px">
        <button class="btn sec" style="flex:1;padding:9px;font-size:12px;color:var(--blue);border-color:var(--blue)" onclick="jAddGuide('${ym}')">+ 장면 추가</button>
        <button class="btn sec" style="flex:1;padding:9px;font-size:12px" onclick="jResetGuide('${ym}')">기본 장면으로 되돌리기</button>
      </div>
    </div>

    <div style="border:1.5px solid var(--red);border-radius:10px;padding:12px;margin-bottom:10px">
      <div style="font-size:13px;font-weight:900;color:var(--red)">받은 사진이 위 장면과 다른가요?</div>
      <div class="cr-hint" style="margin-top:4px">사진을 먼저 올린 뒤 아래 버튼을 누르면 <b>사진 장수만큼 빈 장면 칸</b>이 만들어집니다. 사진을 보면서 한 줄씩 적으세요. 이 순서가 실제 활동과 보고서를 맞추는 가장 정확한 방법입니다.</div>
      <button class="btn" style="background:var(--red);color:#fff;width:100%;margin-top:9px;padding:11px;font-size:13px" onclick="jGuideFromPhotos('${ym}')">받은 사진 기준으로 장면 다시 짜기</button>
      <button class="btn sec" style="width:100%;margin-top:7px;padding:10px;font-size:12.5px;color:var(--blue);border-color:var(--blue)" id="jAiGuideBtn" onclick="jAiGuide('${ym}')">AI가 사진을 읽고 장면 초안 쓰기 (서버 필요 · 10~30초)</button>
      <div id="jAiGuideMsg" style="margin-top:7px;font-size:12px;font-weight:800;display:none"></div>
      <div class="cr-hint" style="margin-top:5px">※ AI가 읽은 숫자는 <b>확정을 눌러야</b> 본문에 쓰입니다. 반드시 사진과 눈으로 대조하세요.</div>
    </div>
    <div style="border:1.5px solid var(--blue);border-radius:10px;padding:12px;background:var(--blue-ll);margin-bottom:10px">
      <div style="font-size:13px;font-weight:800;color:var(--blue-d)">사진 요청 메시지 (대표님께 그대로 전송)</div>
      <textarea id="jKakao" readonly style="width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12px;font-family:inherit;margin-top:6px;background:#fff">${escapeHtml(kakao)}</textarea>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn" style="background:var(--blue);color:#fff;flex:1;padding:10px" onclick="navigator.clipboard.writeText(document.getElementById('jKakao').value).then(()=>alert('복사됐습니다. 카톡/문자에 붙여넣으세요.'))">메시지 복사</button>
        <button class="btn" style="background:var(--red);color:#fff;flex:1;padding:10px" onclick="jShowGuideCard('${ym}')">촬영 가이드 그림 만들기</button>
      </div>
      <div id="jGuideBox"></div>
    </div>
    <div class="fld"><label>받은 사진 올리기 <span style="color:var(--blue-d);font-weight:800">— 파일 이름이 1, 2, 3 … 이면 알맞은 항목에 자동으로 들어갑니다</span></label>
      <input type="file" id="jPhotoInput" multiple accept="image/*" onchange="jAddPhotos('${ym}',this.files)">
    </div>
    <div id="jPhotoMsg" style="display:none;font-size:12px;font-weight:800;margin-top:6px"></div>
    <div class="cr-hint" style="margin-top:8px">현재 올린 사진 <b>${photos.length}장</b>${photos.length?' — 노트를 생성하면 그대로 옮겨집니다.':''}</div>
    <div class="fld" style="margin-top:10px">
      <label>사진에서 읽히는 실제 값·조건 <span style="color:var(--gray);font-weight:600">— 선택이지만 적으면 정확도가 크게 올라갑니다</span></label>
      <textarea id="jRealMemo" onchange="jSaveRealMemo('${ym}',this.value)" style="width:100%;min-height:80px;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12px;font-family:inherit" placeholder="예) 저울 표시값 57.0 g · 52.0 g / 조건은 냉장·냉동 두 가지뿐 / 접시에 담고 손글씨 종이로 구분 / pH 측정기 화면 6.2">${escapeHtml(n.realMemo||'')}</textarea>
      <div class="cr-hint" style="margin-top:4px">사진에 계기판 숫자가 찍혀 있으면 그대로 옮겨 적으세요. AI가 이 값을 그대로 씁니다. <b>비워두면 AI가 그럴듯한 값을 지어냅니다.</b></div>
    </div>
    ${n.content
      ?`<button class="btn" style="background:var(--blue);color:#fff;width:100%;margin-top:10px;padding:11px" onclick="J._forceGuide=null;jViewNote('${ym}')">작성된 ${docName} 화면으로 돌아가기</button>`
      :`<button class="btn" style="background:var(--red);color:#fff;width:100%;margin-top:10px;padding:11px" onclick="jGenGuarded('${ym}')">사진 다 받았습니다 — ${docName} 생성</button>`}
  </div>`;
  if(J._aiGuideMsg){
    const m=document.getElementById('jAiGuideMsg');
    if(m){ m.style.display='block'; m.style.color='var(--blue)'; m.innerHTML=J._aiGuideMsg; }
    J._aiGuideMsg=null;
  }
}

/* 노트 보기 + 사진 + 인쇄 */
function jViewNote(ym){
  const co=J.companies[J.cur]; const n=co?.notes?.[ym]; if(!n) return;
  if(!n.content || J._forceGuide===ym){ return jViewGuideStage(ym); }
  try{ if(jRemapPhotos(n)) jSave(); }catch(e){}   // 이미 만든 노트도 열 때 한 번 자리 잡아줌
  const p=co.plan;
  const per=jPeriod(ym, jStartOf(ym));
  const docName=per.quarter?'연구개발보고서':'연구노트';
  // ── 사진: 본문 항목별 배치 ──
  const secs=jSectionsOf(n.content);
  const photos=(n.photos||[]);
  const secOptions=(cur)=>['<option value="0" '+((parseInt(cur)||0)===0?'selected':'')+'>맨 아래(항목 밖)</option>']
    .concat(secs.map((t,k)=>'<option value="'+(k+1)+'" '+((parseInt(cur)||0)===k+1?'selected':'')+'>'+escapeHtml(t.length>22?t.slice(0,22)+'…':t)+'</option>')).join('');
  try{ if(jSyncCaptions(n,false)) jSave(); }catch(e){}
  const gArr=n.photoGuide||[];
  const sceneOptions=(cur)=>['<option value="" '+((cur==null||cur<0)?'selected':'')+'>장면 지정 안 함</option>']
    .concat(gArr.map((g,k)=>{
      const t=String(g.caption||g.scene||('장면 '+(k+1)));
      return '<option value="'+k+'" '+((parseInt(cur)===k)?'selected':'')+'>'+(k+1)+'. '+escapeHtml(t.length>16?t.slice(0,16)+'…':t)+'</option>';
    })).join('');
  const useCnt={};
  photos.forEach(ph=>{ const g=(ph.gi!=null&&ph.gi>=0)?ph.gi:null; if(g!=null) useCnt[g]=(useCnt[g]||0)+1; });
  const dupList=Object.keys(useCnt).filter(k=>useCnt[k]>1).map(k=>(parseInt(k)+1)+'번');
  const noneCnt=photos.filter(ph=>!(ph.gi!=null&&ph.gi>=0)).length;
  const emptyScenes=gArr.map((g,k)=>k).filter(k=>!useCnt[k]).map(k=>(k+1)+'번');
  const warnHtml=(dupList.length||noneCnt||emptyScenes.length)?`
      <div style="border:1.5px solid var(--red);border-radius:9px;padding:9px 11px;margin-top:8px;background:#fff6f6;font-size:11.5px;font-weight:800;color:var(--red);line-height:1.7">
        ${dupList.length?`· 같은 장면에 사진이 2장 이상 붙었습니다 — ${dupList.join(', ')} 장면<br>`:''}
        ${noneCnt?`· 장면이 지정되지 않은 사진 ${noneCnt}장 — 설명이 비거나 순서가 뒤로 밀립니다<br>`:''}
        ${emptyScenes.length?`· 사진이 없는 장면 — ${emptyScenes.join(', ')}<br>`:''}
        <span style="font-weight:700;color:var(--gray)">아래 [장면] 칸에서 사진마다 몇 번 장면인지 골라 주세요.</span>
      </div>`:'';
  const photoRows=photos.map((ph,i)=>`
    <div class="jph-row">
      <img src="${ph.data}">
      <input value="${escapeHtml(ph.caption||'')}" placeholder="사진 설명 (예: 시료 무게 측정 장면)" onchange="jSetPhoto('${ym}',${i},'caption',this.value)">
      <div class="jph-ctl">
        <span class="jph-no">${i+1}</span>
        <select style="flex:2 1 150px" title="장면" onchange="jSetPhotoScene('${ym}',${i},this.value)">${sceneOptions(ph.gi)}</select>
        <select style="flex:2 1 140px" title="들어갈 항목" onchange="jSetPhoto('${ym}',${i},'sec',this.value)">${secOptions(ph.sec)}</select>
        <select style="flex:0 1 78px" title="크기" onchange="jSetPhoto('${ym}',${i},'size',this.value)">${Object.keys(JPSZ).map(k=>`<option value="${k}" ${((ph.size||'m')===k)?'selected':''}>${JPSZ[k].t}</option>`).join('')}</select>
        <button class="jph-mv" title="앞으로" onclick="jMovePhoto('${ym}',${i},-1)">▲</button>
        <button class="jph-mv" title="뒤로" onclick="jMovePhoto('${ym}',${i},1)">▼</button>
        <button class="jph-del" style="padding:8px 10px" onclick="jRemovePhoto('${ym}',${i})">삭제</button>
      </div>
    </div>`).join('');
  const restPhotos=photos.filter(ph=>!(parseInt(ph.sec)>0 && parseInt(ph.sec)<=secs.length));
  const restHtml=jPhotoBlock(restPhotos);
  try{ jGuideList(n, per.quarter?6:4); }catch(e){}
  const equips=jEquipOf(n, co.plan);
  const eqList=equips.length
    ? equips.map((e,i)=>`${i+1}. ${e.name}${e.qty?' ('+e.qty+')':''}${e.use?' — '+e.use:''}`).join('\n')
    : '(보고서에서 장비 목록을 찾지 못했습니다. 직접 적어주세요)';
  const kakaoMsg=`대표님, ${per.label} ${docName} 작성에 필요한 장비를 안내드립니다.\n\n■ 이번 연구에 사용한 장비\n${eqList}\n\n■ 아직 없는 장비가 있다면\n· 구매하신 뒤 영수증(카드 전표·세금계산서도 가능)을 보내주세요. 연구노트와 함께 보관합니다.\n· 연구소 실태조사에서 장비 보유 여부와 취득 증빙을 확인합니다.\n\n■ 이미 가지고 계신 장비라면\n· 영수증이 없어도 됩니다.\n· 함께 보내드린 연구일지를 출력하셔서 맨 뒷장에 장비 사진이나 구매 내역을 끼워 보관해 주세요.\n\n※ 보고서에 적힌 장비는 실제로 보유·사용하신 것이어야 합니다. 다른 부분이 있으면 알려주시면 수정하겠습니다.`;

  const el=document.getElementById('jNoteView');
  const _nm=jNames(co.plan||{});
  const peopleFix=`
    <div style="border:2px solid ${_nm.length?'var(--line)':'var(--red)'};border-radius:10px;padding:11px;margin-bottom:10px;background:${_nm.length?'#f7f9fc':'#fff2f3'}">
      <div style="font-size:12.5px;font-weight:900;color:${_nm.length?'var(--blue-d)':'var(--red)'}">
        ${_nm.length?'연구원 이름 (머리글·참여인력에 들어감)':'⚠ 연구원 이름이 없습니다 — 아래에 입력하세요'}
      </div>
      <div style="display:flex;gap:6px;margin-top:7px">
        <input id="j_peopleFix" value="${escapeHtml((co.plan&&co.plan.people)||'')}" placeholder="예: 김위, 하철학  (맨 앞이 연구소장)"
          style="flex:1;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px;font-family:inherit">
        <button class="btn" style="background:var(--blue);color:#fff;padding:9px 16px" onclick="jFixPeople('${ym}')">적용</button>
      </div>
      <div class="cr-hint" style="margin-top:5px">연구원 <b>${escapeHtml(jDirector(co.plan||{})||'(미입력)')}</b> · 참여인력 <b>${escapeHtml(jPeopleLine(co.plan||{})||'(미입력)')}</b></div>
    </div>`;
  el.innerHTML=`
  <div class="card no-print">
    <h2>${per.label} ${docName} — 사진 &amp; 출력 <span id="jVolBadge" style="font-size:11px;background:var(--blue-ll);color:var(--blue-d);padding:3px 10px;border-radius:20px;font-weight:800"></span></h2>
    ${peopleFix}
    <div style="border:1.5px solid var(--blue);border-radius:10px;padding:12px;background:var(--blue-ll);margin-bottom:10px">
      <div style="font-size:13px;font-weight:800;color:var(--blue-d)">장비 안내 메시지 (대표님께 그대로 전송)</div>
      <textarea id="jKakao" readonly style="width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:12px;font-family:inherit;margin-top:6px;background:#fff">${escapeHtml(kakaoMsg)}</textarea>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn" style="background:var(--blue);color:#fff;flex:1;padding:10px" onclick="navigator.clipboard.writeText(document.getElementById('jKakao').value).then(()=>alert('복사됐습니다. 카톡/문자에 붙여넣으세요.'))">메시지 복사</button>
        <button class="btn" style="background:var(--red);color:#fff;flex:1;padding:10px" onclick="jShowGuideCard('${ym}')">촬영 가이드 그림 만들기</button>
      </div>
      <div id="jGuideBox"></div>
    </div>
    <div class="fld"><label>받은 사진 올리기 <span style="color:var(--blue-d);font-weight:800">— 파일 이름이 1, 2, 3 … 이면 알맞은 항목에 자동으로 들어갑니다</span></label>
      <input type="file" id="jPhotoInput" multiple accept="image/*" onchange="jAddPhotos('${ym}',this.files)">
    </div>
    <div id="jPhotoMsg" style="display:none;font-size:12px;font-weight:800;margin-top:6px"></div>
    ${photos.length?`
    <div style="margin-top:10px">
      <div style="font-size:12.5px;font-weight:900;color:var(--blue-d)">사진 위치·설명·크기 <span style="font-weight:700;color:var(--gray);font-size:11.5px">— 설명은 촬영 장면에서 자동으로 들어옵니다. 여기서 고치면 그 값이 우선됩니다</span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center">
        <span style="font-size:11.5px;font-weight:800;color:var(--gray)">전체 크기</span>
        ${Object.keys(JPSZ).map(k=>`<button class="btn sec" style="padding:5px 11px;font-size:11px" onclick="jSetAllSize('${ym}','${k}')">${JPSZ[k].t}</button>`).join('')}
        <button class="btn sec" style="padding:5px 11px;font-size:11px" onclick="jSortPhotosBtn('${ym}')">장면 번호대로 줄 세우기</button>
        <button class="btn sec" style="padding:5px 11px;font-size:11px;color:var(--blue);border-color:var(--blue);margin-left:auto" onclick="jResyncCaptions('${ym}')">장면 문장으로 설명 다시 채우기</button>
      </div>
      ${warnHtml}
      ${photoRows}
    </div>`:'<div class="cr-hint" style="margin-top:6px">사진을 올리면 어느 항목 아래에 넣을지 고를 수 있습니다.</div>'}
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" style="background:var(--blue);color:#fff;flex:1" onclick="window.print()">노트 인쇄 / PDF 저장</button>
      <button class="btn sec" style="flex:1" onclick="jCopyNoteText('${ym}')">본문 복사 (한글 템플릿용)</button>
    </div>
    <div class="cr-hint" style="margin-top:6px">※ 인쇄 시 아래 노트 양식만 출력됩니다. 사진은 인쇄 전 원하는 만큼 추가하세요. (사진은 이 브라우저에만 저장)</div>
  </div>

  <div class="jn-sheet" id="jnSheet">
    <table class="jn-head">
      <tr>
        <td rowspan="2" class="jn-co">${escapeHtml(p.company||'')}</td>
        <td class="jn-lbl">작성일자</td>
        <td rowspan="2" class="jn-title" style="${per.quarter?'letter-spacing:2px;font-size:16px':''}">${docName}</td>
        <td class="jn-lbl">${per.quarter?'기록자':'연구원'}</td>
        <td class="jn-lbl">${per.quarter?'점검자(대표)':'대표'}</td>
      </tr>
      <tr>
        <td>${per.endDate}</td>
        <td>${jDirector(p)? escapeHtml(jDirector(p))+' (인)' : JNO_NAME}</td>
        <td>${escapeHtml(p.ceo||'')} (인)</td>
      </tr>
    </table>
    <table class="jn-body">
      <tr><th style="width:110px">연구과제명</th><td>${escapeHtml(n.taskTitle||'')}<br><span style="font-size:12px">(${escapeHtml(n.subTitle||'')})</span></td></tr>
      <tr><th>전체<br>연구개발기간</th><td>${jTotalText(p)}</td></tr>
      <tr><th>연구개발기간</th><td>${per.range}</td></tr>
      <tr><th>연구개발내용</th><td class="jn-content">${mdToHtml(n.content, photos)}</td></tr>
      ${restPhotos.length?`<tr><th>연구활동 사진</th><td>${restHtml}</td></tr>`:''}
      <tr><th>참여인력</th><td>${jPeopleLine(p)? escapeHtml(jPeopleLine(p)) : JNO_NAME}</td></tr>
      <tr><th>비 고</th><td></td></tr>
    </table>
  </div>`;
  el.scrollIntoView({behavior:'smooth',block:'start'});
  // 분량 표시 (인쇄 예상 장수)
  setTimeout(()=>{
    const sh=document.getElementById('jnSheet'), bd=document.getElementById('jVolBadge');
    if(!sh||!bd) return;
    const chars=String(n.content||'').replace(/\s/g,'').length;
    const pages=Math.max(1, Math.round(sh.scrollHeight/1045));
    bd.textContent='본문 '+chars.toLocaleString()+'자 · 인쇄 약 '+pages+'장';
    bd.style.background = pages>=13 ? 'var(--blue-ll)' : '#fff3f3';
    bd.style.color = pages>=13 ? 'var(--blue-d)' : 'var(--red)';
  },120);
}

/* "3. 연구 내용과 사용 장비" 처럼 번호로 시작하는 큰 항목만 골라 매핑
   (## 소제목이 섞여 있어도 장면 순서가 어긋나지 않게 함) */
function jSecSlots(n){
  const secs=jSectionsOf(n.content);
  if(!secs.length) return [];
  const byNo={};
  secs.forEach((t,i)=>{ const m=t.match(/^(\d+)\s*[.)]/); if(m && !byNo[m[1]]) byNo[m[1]]=i+1; });
  const slots=[3,4,5,6,7,9].map(k=>byNo[String(k)]).filter(Boolean);
  if(slots.length) return slots;
  return secs.map((_,i)=>i+1).slice(2,7);
}
/* 장면 번호(0-based) → 들어갈 항목 번호 */
function jDefaultSec(n, idx){
  const slots=jSecSlots(n);
  if(!slots.length) return 0;
  return slots[idx % slots.length];
}
/* 본문이 만들어진 뒤, 아직 자리를 못 잡은 사진(sec=0)을 항목별로 재배치.
   "사진부터 받기"에서는 업로드 시점에 본문이 없어 전부 맨 아래로 몰리므로 반드시 필요. */
function jRemapPhotos(n){
  if(!n || !n.content) return 0;
  const slots=jSecSlots(n);
  if(!slots.length) return 0;
  // 배치 기준이 바뀌었으므로(소제목 제외) 예전에 잡힌 자리는 한 번 비우고 다시 계산
  if(n.secVer!==2){
    (n.photos||[]).forEach(ph=>{ if(!ph.manual) ph.sec=0; });
    n.secVer=2;
  }
  let moved=0;
  (n.photos||[]).forEach((ph,i)=>{
    if(ph.manual) return;                       // 사용자가 직접 고른 자리는 건드리지 않음
    const cur=parseInt(ph.sec)||0;
    if(cur>0) return;                           // 이미 자리 있음
    const gi = (ph.gi!=null && ph.gi>=0) ? ph.gi : ((ph.seq!=null) ? ph.seq-1 : i);
    ph.sec = slots[Math.max(0,gi) % slots.length];
    moved++;
  });
  return moved;
}
/* ===== 워커가 이미지를 모델에 넘기는지 확실히 판별 =====
   랜덤 4자리를 그린 이미지를 보내 읽어보게 함. 정확히 맞히면 지원, 아니면 미지원. */
async function jProbeVision(){
  const el=document.getElementById('jProbeMsg');
  const show=(c,h)=>{ if(el){el.style.display='block';el.style.color=c;el.innerHTML=h;} };
  const base=jWorkerBase();
  if(!base){ show('var(--red)','서버 주소를 먼저 저장하세요.'); return; }
  const code=String(Math.floor(1000+Math.random()*9000));
  const cv=document.createElement('canvas'); cv.width=320; cv.height=160;
  const cx=cv.getContext('2d');
  cx.fillStyle='#fff'; cx.fillRect(0,0,320,160);
  cx.fillStyle='#000'; cx.font='bold 92px sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.fillText(code,160,84);
  const dataUrl=cv.toDataURL('image/png');
  const b64=dataUrl.split(',')[1];
  show('var(--amber)','검사 중입니다 — 시험 이미지를 보내는 중…');
  const prompt='첨부한 이미지에 굵은 검은 글씨로 네 자리 숫자가 하나 적혀 있습니다. 그 숫자만 정확히 답하세요.\n'
    + 'JSON으로만 답하세요: {"content":"<네 자리 숫자>"}\n'
    + '이미지가 보이지 않으면 반드시 {"content":"NOIMAGE"} 라고만 답하세요. 절대 숫자를 추측하지 마세요.';
  try{
    const resp=await fetch(base+'/generate-note',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt, images:[{data:b64, media_type:'image/png'}], image:dataUrl})});
    const r=await resp.json();
    const got=String((r&&r.data&&r.data.content)||r.content||r.raw||'');
    if(got.indexOf(code)>=0){
      localStorage.setItem('nmsc_vision','1');
      show('var(--blue)','✅ 이미지 전송 <b>지원됩니다</b> (시험 숫자 '+code+' 를 정확히 읽었습니다).<br><span style="font-weight:700;font-size:11.5px">알려주시면 사진 내용을 AI가 직접 읽어 본문에 반영하도록 다음 버전에서 연결하겠습니다.</span>');
    }else{
      localStorage.setItem('nmsc_vision','0');
      show('var(--red)','❌ 이미지 전송 <b>안 됩니다</b> (시험 숫자 '+code+' 를 읽지 못했습니다. 응답: '+escapeHtml(got.slice(0,40) || '(빈 응답)')+').<br><span style="font-weight:700;font-size:11.5px">워커가 텍스트만 넘기고 있습니다. 사진 정확도는 아래 [사진에서 읽히는 실제 값] 칸으로 보완하세요.</span>');
    }
  }catch(e){
    show('var(--red)','검사 실패 — '+escapeHtml(e.message||'통신 오류'));
  }
}
/* 현장 실측 메모 (선택) — 본문의 숫자·조건을 사진에 맞추는 최우선 근거 */
function jSaveRealMemo(ym, v){
  const n=J.companies[J.cur]?.notes?.[ym]; if(!n) return;
  n.realMemo=String(v||'').slice(0,1500);
  try{ jSave(); }catch(e){}
}
/* 사진 업로드 — 파일 이름이 1,2,3… 이면 그 장면 번호 위치에 자동 배치 */
function jAddPhotos(ym, files){
  const co=J.companies[J.cur]; const n=co?.notes?.[ym]; if(!n) return;
  n.photos=n.photos||[];
  const guide=n.photoGuide||[];
  const arr=Array.from(files).filter(f=>{
    if(f.size>4*1024*1024){ alert(f.name+': 4MB 초과 — 사진 크기를 줄여주세요'); return false; }
    return true;
  });
  if(!arr.length) return;

  // 파일명 맨 앞(또는 처음 나오는) 숫자 = 장면 번호
  const parsed=arr.map((f,i)=>{
    const seq=jSeqFromName(f.name);
    return {file:f, seq, i};
  });
  parsed.sort((a,b)=>{
    if(a.seq!==null&&b.seq!==null) return a.seq-b.seq;
    if(a.seq!==null) return -1;
    if(b.seq!==null) return 1;
    return a.i-b.i;
  });

  let cursor=n.photos.length;   // 번호 없는 사진용 순번
  Promise.all(parsed.map(x=>nmscShrinkDataUrl(x.file,1400,0.78)
      .then(du=>Object.assign({},x,{data:du}))
      .catch(()=>null)
  )).then(list=>{
    let matched=0;
    list.filter(Boolean).forEach(x=>{
      const gi = (x.seq!==null) ? (x.seq-1) : (cursor++);
      if(x.seq!==null) matched++;
      const g=guide[gi];
      const cap=(g&&(g.caption||g.scene))?String(g.caption||g.scene).slice(0,70):'';
      n.photos.push({data:x.data, caption:cap, size:'m', sec:jDefaultSec(n, gi), seq:(x.seq||null), gi:gi});
    });
    // 장면 번호 순서대로 정렬해 보관
    jSortPhotos(n);
    try{ jSave(); }catch(e){ alert('브라우저 저장공간 부족 — 사진은 화면에만 유지됩니다. 인쇄 후 새로고침하면 사라질 수 있습니다.'); }
    jViewNote(ym);
    const el=document.getElementById('jPhotoMsg');
    if(el){
      el.style.display='block';
      el.innerHTML = matched
        ? '✅ 파일 이름의 번호를 읽어 <b>'+matched+'장</b>을 알맞은 항목 아래에 자동으로 넣었습니다.'
        : '⚠️ 파일 이름에 번호(1,2,3…)가 없어 <b>올린 순서대로</b> 배치했습니다. 아래에서 위치를 조정하세요.';
      el.style.color = matched? 'var(--blue-d)':'var(--red)';
    }
  });
}
function jSetPhoto(ym,i,field,val){
  const n=J.companies[J.cur]?.notes?.[ym]; if(!n||!n.photos||!n.photos[i]) return;
  n.photos[i][field] = (field==='sec') ? (parseInt(val)||0) : val;
  if(field==='sec') n.photos[i].manual=true;   // 수동 배치는 이후 자동 재배치에서 보호
  if(field==='caption') n.photos[i].capManual=true;  // 직접 고친 설명은 자동 갱신에서 보호
  try{ jSave(); }catch(e){}
  jViewNote(ym);
}

function jHistLabel(k){
  return k.includes('Q') ? (k.split('-')[0]+'년 '+k.split('-Q')[1]+'분기') : k.replace('-','.');

function jDeleteNote(key){
  const co=J.companies[J.cur]; if(!co||!co.notes||!co.notes[key]) return;

  const kind = n.content ? '보고서 본문' : '촬영 장면(사진 대기)';
  const np=(n.photos||[]).length;
  const msg='['+jHistLabel(key)+'] 이력을 삭제할까요?\n\n· '+kind+' 삭제'+(np?'\n· 첨부 사진 '+np+'장 함께 삭제':'')+

  delete co.notes[key];

  try{ jCloudPush(J.cur); }catch(e){}

}
