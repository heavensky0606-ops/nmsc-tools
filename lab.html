<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>연구소설립 · KOITA 입력 도우미 | NMSC</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#0A84FF;--blue-d:#0062cc;--blue-l:#e8f2ff;--blue-ll:#f4f9ff;
  --red:#e8202a;--red-l:#ffeaeb;
  --ink:#111;--gray:#666;--line:#e5e5e5;--bg:#f5f7fa;
  --green:#0A84FF;--green-l:#e8f2ff;--amber:#0062cc;--amber-l:#f4f9ff;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;font-weight:500}
.wrap{max-width:880px;margin:0 auto;padding:16px}

.hd{background:var(--blue);color:#fff;border-radius:16px;padding:22px;margin-bottom:14px}
.hd h1{font-size:21px;font-weight:900;letter-spacing:-.5px}
.hd .sub{font-size:13px;font-weight:700;opacity:.95;margin-top:6px}
.hd .law{font-size:11px;font-weight:700;background:rgba(255,255,255,.18);display:inline-block;padding:4px 10px;border-radius:20px;margin-top:10px}

.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px;font-size:12.5px;font-weight:900;cursor:pointer;text-align:center;transition:.12s}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card h2{font-size:17px;font-weight:900;letter-spacing:-.4px;margin-bottom:4px}
.card .desc{font-size:12.5px;font-weight:600;color:var(--gray);margin-bottom:16px}

.howto{background:var(--amber-l);border:1.5px solid var(--amber);border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:12.5px;font-weight:700;color:#8a5200}
.howto b{color:var(--amber)}
.howto ol{margin:6px 0 0 18px}
.howto li{padding:2px 0}

/* form */
.frm-sec{margin-bottom:18px}
.frm-sec .st{font-size:13px;font-weight:900;color:var(--blue-d);background:var(--blue-l);padding:6px 12px;border-radius:8px;margin-bottom:10px;display:inline-block}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.frow.one{grid-template-columns:1fr}
.fld label{font-size:11.5px;font-weight:800;color:var(--gray);display:block;margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-weight:600;font-family:inherit;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--blue)}
.fld textarea{min-height:60px;resize:vertical}

.btn{border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;transition:.12s;width:100%}
.btn.gen{background:var(--red);color:#fff;font-size:16px}
.btn.gen:hover{background:#c41820}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}

.add-btn{width:100%;border:2px dashed var(--blue);color:var(--blue);background:var(--blue-l);border-radius:10px;padding:11px;font-size:13px;font-weight:900;cursor:pointer;margin-bottom:8px}
.person-row,.equip-row{border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;position:relative}
.person-row .del,.equip-row .del{position:absolute;top:8px;right:8px;background:var(--red-l);color:var(--red);border:none;border-radius:6px;padding:3px 9px;font-size:11px;font-weight:900;cursor:pointer}
.pr-tag{position:absolute;top:-9px;left:10px;background:var(--blue);color:#fff;font-size:10px;font-weight:900;padding:2px 9px;border-radius:20px}

/* output copy cards */
.out-tab-title{font-size:15px;font-weight:900;margin:18px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--blue);color:var(--blue-d);display:flex;align-items:center;gap:8px}
.out-tab-title .ktab{font-size:10px;background:var(--blue);color:#fff;padding:3px 10px;border-radius:20px;font-weight:900}
.copyrow{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.copyrow .cr-body{flex:1;min-width:0}
.copyrow .cr-label{font-size:11px;font-weight:900;color:var(--gray);margin-bottom:3px}
.copyrow .cr-val{font-size:13.5px;font-weight:700;word-break:break-all;white-space:pre-wrap;line-height:1.5}
.copyrow .cr-val.long{font-size:12.5px;font-weight:600}
.copyrow .cbtn{flex-shrink:0;background:var(--blue-l);color:var(--blue-d);border:none;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer;transition:.12s;white-space:nowrap}
.copyrow .cbtn:hover{background:var(--blue);color:#fff}
.copyrow .cbtn.done{background:var(--green);color:#fff}
.cr-hint{font-size:11px;font-weight:600;color:var(--amber);margin-top:4px}

/* table output for people/equip */
.otable{width:100%;border-collapse:collapse;font-size:11.5px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-bottom:8px}
.otable th{background:var(--blue-l);color:var(--blue-d);font-weight:900;padding:7px 6px;text-align:left;font-size:11px}
.otable td{padding:7px 6px;border-top:1px solid var(--line);font-weight:600}
.otable td .mini-copy{background:none;border:1px solid var(--blue);color:var(--blue);border-radius:5px;padding:1px 6px;font-size:10px;font-weight:900;cursor:pointer;margin-left:3px}
.otable tr:hover td{background:var(--bg)}
.otable-wrap{overflow-x:auto}

.tip-box{background:var(--green-l);border:1.5px solid var(--green);border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--green)}
.tip-box .wt{font-weight:900;margin-bottom:3px}
.warn-box{background:var(--red-l);border:1.5px solid var(--red);border-radius:12px;padding:13px 15px;margin-bottom:12px;font-size:12.5px;font-weight:700;color:var(--red)}
.warn-box .wt{font-weight:900;margin-bottom:3px}

.docs-list{list-style:none}
.docs-list li{font-size:12.5px;font-weight:700;padding:9px 0 9px 26px;position:relative;border-bottom:1px solid var(--line)}
.docs-list li:before{content:"📄";position:absolute;left:0}
.docs-list li:last-child{border-bottom:none}
.docs-list li small{color:var(--gray);font-weight:600;display:block;margin-top:1px}
.docs-list li.have:before{content:"✅"}

/* 서류 안내 가이드 */
details.card > summary{list-style:none}
details.card > summary::-webkit-details-marker{display:none}
details.card > summary::before{content:"▶ ";font-size:12px;color:var(--amber)}
details.card[open] > summary::before{content:"▼ "}
.doc-guide{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.dg-item{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbfbfb}
.dg-head{font-size:12.5px;font-weight:800;color:#222;display:flex;align-items:center;gap:6px}
.dg-must{font-size:10px;font-weight:900;color:#fff;background:var(--red);padding:2px 7px;border-radius:20px;flex-shrink:0}
.dg-rec{font-size:10px;font-weight:900;color:#fff;background:var(--amber);padding:2px 7px;border-radius:20px;flex-shrink:0}
.dg-where{font-size:11.5px;font-weight:600;color:var(--gray);margin-top:4px;line-height:1.5}
.dg-where a{color:var(--blue);font-weight:800;text-decoration:none}
.dg-where a:hover{text-decoration:underline}

.foot{text-align:center;font-size:11px;font-weight:600;color:var(--gray);padding:14px 0 30px}

/* ===== 연구일지: 노트 양식 ===== */
/* CEO 응대 스크립트 */
.ceo-script{margin:8px 0 12px;border:1px solid var(--blue-l);border-radius:9px;overflow:hidden;background:var(--blue-ll)}
.ceo-script>summary{cursor:pointer;padding:9px 13px;font-size:12px;font-weight:800;color:var(--blue-d);list-style:none;user-select:none}
.ceo-script>summary::-webkit-details-marker{display:none}
.ceo-script>summary::before{content:"▸ ";font-weight:900}
.ceo-script[open]>summary::before{content:"▾ "}
.ceo-in{padding:4px 14px 12px;font-size:12px;line-height:1.7;color:#234}
.ceo-in .cq{font-weight:900;color:var(--red);margin-top:8px}
.ceo-in .ca{margin:2px 0 2px 4px}
.ceo-in .ct{font-weight:800;color:var(--blue-d);margin-bottom:4px}

.jn-sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-top:14px}
.jn-head{width:100%;border-collapse:collapse;margin-bottom:-1px}
.jn-head td{border:1px solid #333;padding:8px 10px;font-size:12.5px;text-align:center;vertical-align:middle}
.jn-head .jn-co{font-weight:900;font-size:14px;width:24%}
.jn-head .jn-title{font-weight:900;font-size:19px;letter-spacing:8px;width:30%}
.jn-head .jn-lbl{background:#f0f5ff;font-weight:800;width:14%}
.jn-body{width:100%;border-collapse:collapse}
.jn-body th{border:1px solid #333;background:#f0f5ff;padding:10px 10px;font-size:13.5px;font-weight:800;text-align:center;vertical-align:middle}
.jn-body td{border:1px solid #333;padding:12px 14px;font-size:13.5px;vertical-align:top}
.jn-content{line-height:1.95;font-size:13.5px}
.jn-h{font-weight:900;font-size:15px;margin:16px 0 7px;color:#111;page-break-after:avoid}
.jn-p{margin:4px 0;font-size:13.5px}
.jn-li{margin:4px 0 4px 10px;font-size:13.5px}
.jn-graph{margin:12px 0;padding:9px;border:1px solid #ccd8ea;border-radius:8px;background:#fbfdff;page-break-inside:avoid}
.jn-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px;page-break-inside:avoid}
.jn-table th{border:1px solid #555;background:#f5f8ff;padding:7px 8px;font-weight:800;text-align:center}
.jn-table td{border:1px solid #555;padding:7px 8px;text-align:center}
.jn-photos{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.jn-photo{position:relative;text-align:center;width:48%}
.jn-photo img{width:100%;max-height:220px;object-fit:contain;border:1px solid #ccc;border-radius:4px}
.jn-photos.one{max-width:none}
.jn-cap{font-size:11px;font-weight:700;color:#333;margin-top:3px}
.jn-phx{position:absolute;top:4px;right:4px;background:var(--red);color:#fff;border:none;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:900;cursor:pointer}
/* 본문 섹션 하단에 들어가는 사진 블록 */
.jn-photos{page-break-inside:avoid}
.jn-inphotos{margin:9px 0 4px;page-break-inside:avoid}
.jn-inphotos .jn-photos{}

.jn-phcap{font-size:11px;font-weight:800;color:#0060df;margin-bottom:4px}
/* 사진 관리 리스트(화면 전용) */
.jph-row{display:grid;grid-template-columns:72px 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px;margin-top:6px;background:#fff}
.jph-row img{grid-row:span 2;width:72px;height:64px;object-fit:cover;border-radius:5px;border:1px solid #ddd;align-self:start}
.jph-ctl{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.jph-ctl select{flex:0 1 auto;min-width:0}
.jph-mv{width:30px;height:31px;padding:0;border:1px solid var(--line);background:#fff;color:var(--gray);border-radius:6px;font-size:11px;font-weight:900;cursor:pointer}
.jph-no{flex:0 0 auto;font-size:11px;font-weight:900;color:var(--blue);background:var(--blue-ll);border-radius:6px;padding:6px 8px}
.jph-row input,.jph-row select{width:100%;border:1.5px solid var(--line);border-radius:7px;padding:7px 8px;font-size:11.5px;font-family:inherit;background:#fff}
.jph-del{background:var(--red);color:#fff;border:none;border-radius:7px;padding:8px 0;font-size:11px;font-weight:900;cursor:pointer}
.jq-chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer;color:#111}
.jq-chip.done{border-color:var(--blue);background:var(--blue-ll);color:var(--blue-d)}
.jq-chip.todo{border-color:var(--red);color:var(--red)}
.jh{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.jh-b{border:0;background:transparent;padding:7px 10px;font-size:11.5px;font-weight:800;color:#111;cursor:pointer;font-family:inherit}
.jh-b:hover{background:var(--blue-ll);color:var(--blue-d)}
.jh-x{border:0;border-left:1.5px solid var(--line);background:#fff;color:#9aa7b4;padding:0 8px;font-size:12px;font-weight:900;cursor:pointer;line-height:1;font-family:inherit}
.jh-x:hover{background:var(--red);color:#fff;border-left-color:var(--red)}
@media(max-width:560px){.jph-row{grid-template-columns:56px 1fr;grid-auto-rows:auto}.jph-row img{grid-row:span 2;height:56px}}
@media print{
  body *{visibility:hidden}
  .jn-sheet,.jn-sheet *{visibility:visible}
  .jn-sheet{position:absolute;left:0;top:0;width:100%;border:none;border-radius:0;padding:0;margin:0}
  .no-print,.no-print *{display:none!important}
}
.copy-all{background:var(--green);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:900;cursor:pointer;width:100%;margin-bottom:10px}
.result-head{background:linear-gradient(135deg,var(--green),#0d7a40);color:#fff;border-radius:14px;padding:18px;margin-bottom:14px;text-align:center}
.result-head .rh-t{font-size:18px;font-weight:900}
.result-head .rh-s{font-size:12px;font-weight:700;opacity:.95;margin-top:3px}
@media(max-width:560px){.frow{grid-template-columns:1fr}.tab{font-size:11px;padding:9px 3px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>🔬 연구소설립 · KOITA 입력 도우미</h1>
    <div class="sub">업체 정보를 넣으면 KOITA(rnd.or.kr) 온라인 신청란에 그대로 복사할 입력값을 만들어 드립니다</div>
    <div class="law">2026.2.1 시행 신법 · 先설립·後신고 · 복사→붙여넣기 방식</div>
  </div>

  <div class="tabs">
    <div class="tab on" id="tab-gen" onclick="switchTab('gen')">신규 업체 입력</div>
    <div class="tab" id="tab-journal" onclick="switchTab('journal')">연구일지</div>
    <div class="tab" id="tab-guide" onclick="switchTab('guide')">절차·서류</div>
  </div>

  <div id="app"></div>

  <div class="foot">NMSC 나이스경영지원센터 · 신고기관 한국산업기술진흥협회(KOITA) rnd.or.kr · 처리기간 약 10일<br>※ 생성값은 초안입니다. KOITA 제출 전 실제 서류와 대조 확인하세요</div>
</div>

<script>
/* ================= STATE ================= */
const S = { view:'gen', generated:false };
const D = {
  // 기업
  bizName:'', bizType:'corp', bizNo:'', ksicBiz:'', mainProduct:'',
  ceo:'', ceoBirth:'', ceoForeign:'domestic', tel:'', fax:'', email:'',
  addr:'', addrDetail:'', foundDate:'',
  scale:'small', validDate:'',
  revenue:'', asset:'', capital:'', empCount:'',
  // 연구소/전담부서
  labType:'dept', labName:'', field:'service', ksicLab:'', labAddr:'', labAddrDetail:'',
  spaceType:'independent', ownType:'rent', area:'',
  foundLabDate:'',
  // 연구내용
  industry:'food',
  researchTopic:'',
  // 인력
  people:[],
  // 기자재
  equip:[],
  _overviewOverride:null
};

/* ============ 업종별 개요서/과제 템플릿 ============ */
const TEMPLATES = {
  food:{
    main:(p)=>`${p||'취급 제품'}의 품질 안정성 및 저장·유통 환경에 관한 연구를 담당한다. 기업의 전체 경영활동(수입·유통·판매) 중 연구개발전담부서는 상온·냉장·냉동 등 보관조건에 따른 제품의 중량, pH, 수분, 표면 상태 및 물성 변화를 체계적으로 측정·분석하고, 보관환경별 데이터를 축적·관리하여 품질 저하 요인을 규명하며, 안정적인 제품 보관 및 유통 품질관리 기준을 수립하는 역할을 수행한다.`,
    field:(p)=>`${p||'제품'} 품질관리 방안 및 저장성 분석 분야를 중심으로 보관환경에 따른 품질 안정성 연구를 수행한다. 상온·냉장·냉동 등 다양한 보관조건 변화에 따른 제품의 중량, 수분 상태, pH 및 물성 변화를 분석하고, 유통 및 보관 과정에서 발생할 수 있는 품질 저하 요인을 체계적으로 연구하며, 보관 기간에 따른 표면 상태 및 품질 유지성을 비교·분석하여 안정적인 유통환경 구축과 품질관리 기준을 연구한다.`,
    tasks:[
      {n:'유통 환경 변화에 따른 제품의 품질 유지성 연구', c:'온도 및 보관환경 변화에 따른 제품의 품질 유지 상태와 유통 안정성을 비교 분석함', b:30},
      {n:'저장 기간에 따른 제품의 물성 변화 연구', c:'저장 기간별 품질 변화를 비교하여 제품의 저장 안정성 및 유통 가능 기간을 분석함', b:30},
      {n:'보관 조건별 제품 품질 안정성 연구', c:'상온·냉장·냉동 보관 조건에 따른 제품의 중량, pH, 표면 상태 및 물성 변화를 분석하고 품질 유지 기준을 연구함', b:40}
    ]
  },
  manufacture:{
    main:(p)=>`${p||'제품'}의 제조 공정 개선 및 품질 향상에 관한 연구를 담당한다. 기업의 전체 경영활동(생산·품질관리·영업) 중 연구개발전담부서는 원재료 특성 분석, 공정 조건 최적화, 시제품 설계·제작 및 시험을 수행하고, 공정별 데이터를 축적·관리하여 불량 요인을 규명하며, 제품 성능 및 생산성 향상을 위한 기술 기준을 수립하는 역할을 수행한다.`,
    field:(p)=>`${p||'제품'} 제조 공정 및 품질 개선 분야를 중심으로 연구개발을 수행한다. 원재료 물성 및 공정 조건 변화에 따른 제품 특성 변화를 분석하고, 생산 과정에서 발생하는 불량·품질 저하 요인을 체계적으로 연구하며, 시제품 시험 결과를 바탕으로 공정 최적화 및 제품 성능 향상을 위한 기술 기준을 연구한다.`,
    tasks:[

/* ================= RENDER ================= */
function switchTab(v){
  S.view=v;
  ['gen','journal','guide'].forEach(t=>{
    document.getElementById('tab-'+t).className='tab'+(v===t?' on':'');
  });
  render();
}
function render(){
  const app=document.getElementById('app');
  if(S.view==='gen') app.innerHTML = S.generated ? renderOutput(D) : renderForm();
  else if(S.view==='journal') app.innerHTML = renderJournal();
  else if(S.view==='guide') app.innerHTML = renderGuide();
  window.scrollTo(0,0);
  bindCopy();
  if(S.view==='gen' && !S.generated){ bindDropzone(); renderFileList(); }
  if(S.view==='journal'){ bindJournal(); }
}

/* ---------- 공용: 업로드 이미지 축소 + 분할 전송 (413 방지) ---------- */
const NMSC_IMG_MAX = 1568;        // Claude가 실제로 보는 최대 변 길이
const NMSC_BATCH_BYTES = 3.2*1024*1024;  // 요청 1건당 base64 상한
const NMSC_BATCH_FILES = 4;       // 요청 1건당 최대 파일 수

function nmscBytes(b64){ return Math.round((b64||'').length*0.75); }
function nmscKB(n){ return n>=1024*1024 ? (n/1024/1024).toFixed(1)+'MB' : Math.max(1,Math.round(n/1024))+'KB'; }

function nmscReadDataUrl(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('읽기 실패')); r.readAsDataURL(file); });
}

/* 이미지를 캔버스로 줄여 JPEG base64로 반환. PDF 등은 원본 그대로 */
async function nmscShrink(file, maxEdge, quality){
  maxEdge = maxEdge || NMSC_IMG_MAX; quality = quality || 0.82;
  const dataUrl = await nmscReadDataUrl(file);
  const base = {name:file.name, media_type:file.type||'application/octet-stream', data:dataUrl.split(',')[1], orig:file.size};
  if(!/^image\//.test(file.type||'')) return base;
  try{
    const img = await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('이미지 해석 실패')); im.src=dataUrl; });
    let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    if(!w||!h) return base;
    const sc=Math.min(1, maxEdge/Math.max(w,h));
    w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
    const cx=cv.getContext('2d');
    cx.fillStyle='#fff'; cx.fillRect(0,0,w,h);
    cx.drawImage(img,0,0,w,h);
    let q=quality, out=cv.toDataURL('image/jpeg',q);
    while(out.length > 1.5*1024*1024 && q > 0.4){ q-=0.12; out=cv.toDataURL('image/jpeg',q); }
    const b64=out.split(',')[1];
    if(b64.length < base.data.length) return {name:file.name, media_type:'image/jpeg', data:b64, orig:file.size};
    return base;
  }catch(e){ return base; }
}

/* 이미지 축소 후 dataURL 그대로 반환 (노트 사진 저장용) */
async function nmscShrinkDataUrl(file, maxEdge, quality){
  const o = await nmscShrink(file, maxEdge||1400, quality||0.78);
  return 'data:'+o.media_type+';base64,'+o.data;
}

/* 파일 배열을 요청 단위로 쪼갬 */
function nmscMakeBatches(files){
  const out=[]; let cur=[], size=0;
  files.forEach(f=>{
    const len=(f.data||'').length;
    if(cur.length && (cur.length>=NMSC_BATCH_FILES || size+len > NMSC_BATCH_BYTES)){ out.push(cur); cur=[]; size=0; }
    cur.push(f); size+=len;
  });
  if(cur.length) out.push(cur);
  return out;
}

/* 파싱 결과 병합 — 먼저 읽은 값 우선, 빈 값만 뒤 결과로 채움 */
function nmscMergeParsed(a,b){
  if(!a) return b||{}; if(!b) return a;
  const out=Object.assign({},a);
  Object.keys(b).forEach(k=>{
    const bv=b[k];
    if(bv===undefined||bv===null||bv==='') return;
    if(k==='coverage'){ out.coverage=nmscMergeCoverage(out.coverage,bv); return; }
    if(Array.isArray(bv)){
      const av=Array.isArray(out[k])?out[k].slice():[];
      const key=x=>(k==='people')?((x.name||'')+'|'+(x.rrn||'')):(k==='equip'?String(x.name||''):JSON.stringify(x));
      const seen=new Set(av.map(key));
      bv.forEach(x=>{ const kk=key(x); if(!seen.has(kk)){ seen.add(kk); av.push(x); } });
      out[k]=av; return;
    }
    if(typeof bv==='object'){ out[k]=nmscMergeParsed(out[k]||{},bv); return; }
    if(out[k]===undefined||out[k]===null||out[k]==='') out[k]=bv;
  });
  return out;
}
function nmscMergeCoverage(a,b){
  a=a||{}; b=b||{};
  const rank={missing:0, weak:1, ok:2};
  const items=[]; const idx={};
  (a.items||[]).concat(b.items||[]).forEach(it=>{
    const k=it.key||it.label||it.name||JSON.stringify(it);
    if(idx[k]===undefined){ idx[k]=items.length; items.push(Object.assign({},it)); }
    else{
      const cur=items[idx[k]];
      if((rank[it.status]||0) > (rank[cur.status]||0)) items[idx[k]]=Object.assign({},it);
    }
  });
  const docs=[];
  (a.detectedDocs||[]).concat(b.detectedDocs||[]).forEach(d=>{ if(docs.indexOf(d)<0) docs.push(d); });
  const out=Object.assign({},a,b);
  out.items=items; out.detectedDocs=docs;
  return out;
}

/* 여러 묶음으로 나눠 /parse-docs 호출 후 결과 병합 */
async function nmscParseDocsBatched(url, files, note, onProgress){
  const batches=nmscMakeBatches(files);
  let data=null, notes=[], errs=[];
  for(let i=0;i<batches.length;i++){
    if(onProgress) onProgress(i+1, batches.length);
    const body={files:batches[i], note:note+(batches.length>1?('\n\n(전체 '+files.length+'개 서류 중 '+(i+1)+'번째 묶음입니다. 이 묶음에서 읽히는 항목만 채우고, 없는 항목은 빈 값으로 두세요.)'):'')};
    let resp, r;
    try{
      resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    }catch(e){ throw new Error('통신 실패: '+e.message); }
    if(resp.status===413){
      throw new Error('용량초과(413) — 서류 용량이 여전히 큽니다. 사진 대신 PDF를 줄이거나, 서류를 몇 개씩 나눠 올려주세요.');
    }
    try{ r=await resp.json(); }
    catch(e){ throw new Error('서버 응답을 읽지 못했습니다 (HTTP '+resp.status+')'); }
    if(r.error && !r.data){ errs.push(r.error); if(r.raw) errs.push(String(r.raw).slice(0,300)); continue; }
    data=nmscMergeParsed(data, r.data||{});
    if(r.notes) notes.push(r.notes);
  }
  if(!data && errs.length) throw new Error(errs.join(' / '));
  return {data:data||{}, notes:notes.join('\n'), batches:batches.length};
}

async function handleFiles(fileList){
  const arr=Array.from(fileList).filter(file=>{
    if(file.size > 20*1024*1024){ alert(file.name+' : 20MB를 초과해 제외합니다'); return false; }
    if(/pdf/.test(file.type||'') && file.size > 5*1024*1024){ alert(file.name+' : PDF가 커서(5MB 초과) 분석에 실패할 수 있습니다. 필요한 쪽만 캡처해 이미지로 올리면 확실합니다.'); }

    }catch(e){ alert(file.name+' : 읽지 못해 제외합니다'); }

/* ---------- 서류 점검표(coverage) 렌더 ---------- */
function renderCoverage(cov){
  const el=document.getElementById('parseCoverage');
  if(!el) return;
  if(!cov || !Array.isArray(cov.items) || cov.items.length===0){ el.style.display='none'; el.innerHTML=''; return; }

  const meta={ ok:{i:'✅',t:'확인됨',c:'var(--green)',bg:'var(--green-l)'},
               weak:{i:'⚠️',t:'부족·확인필요',c:'var(--amber)',bg:'var(--amber-l)'},
               missing:{i:'❌',t:'없음',c:'var(--red)',bg:'var(--red-l)'} };

  const okN=cov.items.filter(x=>x.status==='ok').length;
  const weakN=cov.items.filter(x=>x.status==='weak').length;
  const missN=cov.items.filter(x=>x.status==='missing').length;

  const detected=Array.isArray(cov.detectedDocs)&&cov.detectedDocs.length
    ? `<div style="font-size:11.5px;font-weight:700;color:var(--gray);margin-bottom:8px">📎 인식한 서류: ${cov.detectedDocs.map(escapeHtml).join(', ')}</div>` : '';

  const rows=cov.items.map(it=>{
    const m=meta[it.status]||meta.weak;
    const note=(it.status!=='ok'&&it.note)?`<div style="font-size:11.5px;font-weight:600;color:${m.c};margin-top:3px">↳ ${escapeHtml(it.note)}</div>`:'';
    const src=(it.status==='ok'&&it.source)?`<span style="font-size:11px;font-weight:600;color:var(--gray)"> · ${escapeHtml(it.source)}</span>`:'';
    return `<div style="display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:9px;background:${m.bg};margin-bottom:6px">
      <span style="font-size:15px;flex-shrink:0">${m.i}</span>
      <div style="flex:1">
        <div style="font-size:12.5px;font-weight:800;color:${m.c}">${escapeHtml(it.label||it.key||'')} <span style="font-weight:900">— ${m.t}</span>${src}</div>
        ${note}
      </div>
    </div>`;
  }).join('');

  const banner = missN>0
    ? `<div style="font-size:12.5px;font-weight:900;color:var(--red)">❌ 꼭 필요한 서류 ${missN}건이 없습니다. 아래 표시된 서류를 추가로 준비해 다시 올려주세요.</div>`
    : (weakN>0
      ? `<div style="font-size:12.5px;font-weight:900;color:var(--amber)">⚠️ ${weakN}건은 확인이 더 필요합니다. 내용을 검토하세요.</div>`
      : `<div style="font-size:12.5px;font-weight:900;color:var(--green)">✅ 필요한 서류가 모두 확인되었습니다.</div>`);

  el.style.display='block';
  el.innerHTML=`
    <div style="border:2px solid var(--line);border-radius:12px;padding:14px 15px;background:#fff">
      <div style="font-size:14px;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:7px">🔍 서류 점검표
        <span style="font-size:11px;font-weight:800;color:var(--gray)">확인 ${okN} · 부족 ${weakN} · 없음 ${missN}</span></div>
      <div style="margin:6px 0 10px">${banner}</div>
      ${detected}
      ${rows}
      <div class="cr-hint" style="margin-top:8px">※ 이 점검표는 업로드한 서류만으로 판단한 결과입니다. 실제 신고 전 원본 서류를 다시 확인하세요.</div>
    </div>`;
}

/* ---------- copy binding ---------- */
function bindCopy(){
  document.querySelectorAll('[data-copy]').forEach(btn=>{
    btn.onclick=()=>{
      const el=document.getElementById(btn.dataset.copy);
      if(!el)return;
      doCopy(el.innerText, btn);
    };
  });
  document.querySelectorAll('[data-copy-text]').forEach(btn=>{
    btn.onclick=()=>doCopy(btn.dataset.copyText, btn);
  });
}
function doCopy(text,btn){
  navigator.clipboard.writeText(text).then(()=>{
    const orig=btn.textContent;
    btn.textContent='✓ 복사됨'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent=orig;btn.classList.remove('done')},1200);
  }).catch(()=>{
    // fallback
    const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    btn.textContent='✓'; setTimeout(()=>btn.textContent='복사',1200);
  });
}

function jLoad(){ try{ const r=JSON.parse(localStorage.getItem(JKEY)||'{}'); J.companies=r.companies||{}; J.cur=r.cur||''; }catch(e){} try{ jMigrateNames(); }catch(e){} }

function jWorkerBase(){
  // 저장된 parse-docs URL에서 베이스 추출 → /generate-plan 등으로 변환
  const u=(localStorage_get('nmsc_worker_url')||'').trim();

/* ---- 클라우드 동기화 (D1) ---- */
function jKey(){ return (localStorage_get('nmsc_journal_key')||'').trim(); }
function jStripPhotos(co){
  // 클라우드엔 사진 제외(용량) — 텍스트만
  const c=JSON.parse(JSON.stringify(co));
  Object.values(c.notes||{}).forEach(n=>{ delete n.photos; });
  return c;
}
async function jCloudPush(name){
  const base=jWorkerBase(), key=jKey();
  if(!base||!key||!name||!J.companies[name]) return;
  try{
    await fetch(base+'/journal-save',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key, company:name, data:jStripPhotos(J.companies[name])})});
    jSyncStatus('저장됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ jSyncStatus('저장 실패(오프라인?)'); }
}
async function jCloudDelete(name){
  const base=jWorkerBase(), key=jKey();
  if(!base||!key) return;
  try{ await fetch(base+'/journal-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key, company:name})}); }catch(e){}
}
async function jCloudPullAll(silent){
  const base=jWorkerBase(), key=jKey();
  if(!base||!key){ if(!silent) alert('팀 키를 먼저 저장하세요.'); return false; }
  try{
    const resp=await fetch(base+'/journal-load',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const r=await resp.json();
    if(r.error){ if(!silent) alert('불러오기 실패: '+r.error); jSyncStatus('연결 실패'); return false; }
    let changed=false;
    Object.entries(r.companies||{}).forEach(([name,data])=>{
      const local=J.companies[name];
      if(!local){ J.companies[name]=data; changed=true; }
      else{
        // 병합: 클라우드에만 있는 노트 가져오기 + 로컬 사진 유지, 계획서는 클라우드 우선
        if(data.plan) local.plan=data.plan;
        Object.entries(data.notes||{}).forEach(([ym,n])=>{
          if(!local.notes[ym]) { local.notes[ym]=n; changed=true; }
          else { const ph=local.notes[ym].photos; local.notes[ym]={...n, photos:ph||[]}; }
        });
      }
    });
    if(!J.cur||!J.companies[J.cur]) J.cur=Object.keys(J.companies)[0]||'';
    jSave();
    jSyncStatus('동기화됨 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}));
    return changed;
  }catch(e){ jSyncStatus('연결 실패'); if(!silent) alert('클라우드 연결 실패: '+e.message); return false; }
}

/* ---- JSON 백업/복원 ---- */
function jExportAll(){
  const blob=new Blob([JSON.stringify(J,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='연구일지_백업_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function jImportAll(files){
  const f=files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      if(!obj.companies) throw new Error('형식이 다릅니다');
      Object.entries(obj.companies).forEach(([n,d])=>{ J.companies[n]=d; });
      if(!J.cur||!J.companies[J.cur]) J.cur=Object.keys(J.companies)[0]||'';
      jSave(); alert('복원 완료: '+Object.keys(obj.companies).length+'개 회사'); render();
    }catch(e){ alert('복원 실패: '+e.message); }
  };
  rd.readAsText(f);
}

/* ===== 연구일지 전용 서류 업로드 → AI 자동 입력 ===== */
let _jFiles = [];              // {name, media_type, data}
let _jParsedExtra = null;      // {equip:[], tasks:[], labName, labAddr, area}

function bindJournalDropzone(){
  const dz=document.getElementById('jDropzone'), fi=document.getElementById('jFileInput');
  if(!dz||!fi) return;
  dz.onclick=()=>fi.click();
  dz.ondragover=e=>{e.preventDefault();dz.style.background='#d7e8ff';};
  dz.ondragleave=()=>{dz.style.background='';};
  dz.ondrop=e=>{e.preventDefault();dz.style.background='';jHandleFiles(e.dataTransfer.files);};
  fi.onchange=()=>jHandleFiles(fi.files);
  jRenderFileList();
}
async function jHandleFiles(fileList){
  const arr=Array.from(fileList).filter(file=>{
    if(file.size>20*1024*1024){ alert(file.name+' : 20MB를 초과해 제외합니다'); return false; }
    if(/pdf/.test(file.type||'') && file.size > 5*1024*1024){ alert(file.name+' : PDF가 커서(5MB 초과) 분석에 실패할 수 있습니다. 필요한 쪽만 캡처해 이미지로 올리면 확실합니다.'); }
    return true;
  });
  const st=document.getElementById('jParseStatus');
  if(st && arr.length>1){ st.style.display='block'; st.style.color='var(--gray)'; st.innerHTML='⏳ 사진 용량을 줄이는 중... (0/'+arr.length+')'; }
  let k=0;
  for(const file of arr){
    try{ _jFiles.push(await nmscShrink(file)); }
    catch(e){ alert(file.name+' : 읽지 못해 제외합니다'); }
    k++;
    if(st && arr.length>1) st.innerHTML='⏳ 사진 용량을 줄이는 중... ('+k+'/'+arr.length+')';
    jRenderFileList();
  }
  if(st && arr.length>1){
    const tot=_jFiles.reduce((a,f)=>a+nmscBytes(f.data),0);
    st.style.color='var(--blue)';
    st.innerHTML='📎 서류 '+_jFiles.length+'개 준비 완료 (합계 '+nmscKB(tot)+'). 아래 빨간 버튼을 누르세요.';
  }
}
function jRenderFileList(){
  const el=document.getElementById('jFileList'); if(!el) return;
  if(!_jFiles.length){ el.innerHTML=''; return; }
  el.innerHTML=_jFiles.map((f,i)=>`
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:5px">
      <span style="font-size:16px">${f.media_type.includes('pdf')?'📄':'🖼️'}</span>
      <span style="flex:1;font-size:12px;font-weight:700;word-break:break-all">${escapeHtml(f.name)}<span style="font-weight:600;color:var(--gray);margin-left:6px;font-size:11px">${nmscKB(nmscBytes(f.data))}${(f.orig&&f.orig>nmscBytes(f.data)*1.25)?' (축소됨)':''}</span></span>

async function jParseDocs(){
  const base=jWorkerBase();
  const st=document.getElementById('jParseStatus');
  const show=(c,h)=>{ if(st){st.style.display='block';st.style.color=c;st.innerHTML=h;} };
  if(!base){ show('var(--red)','❌ 서버 주소가 없습니다. 맨 위 [⚙️ 서버 주소 설정]에서 저장하세요.'); return; }
  if(!_jFiles.length){ show('var(--red)','❌ 먼저 서류를 올려주세요.'); return; }
  const btn=document.getElementById('jParseBtn'); if(btn){btn.disabled=true;btn.style.opacity='.6';}
  show('var(--amber)','⏳ AI가 서류를 읽는 중입니다... (10~30초)');
  const note='이 회사는 이미 기업부설연구소 또는 연구개발전담부서 인정을 받은 업체입니다(설립 완료). 연구소인정서에서 인정일(foundLabDate)·부서명(labName)·구분(labType)을, 사업자등록증에서 회사명·대표자·업종·주요제품을, 연구계획서나 KOITA 개요서가 있으면 연구과제(overview.tasks)를, 장비 목록이 있으면 equip을 정확히 읽어주세요. 연구원 명단은 people로 주세요.';
  try{
    const r=await nmscParseDocsBatched(base+'/parse-docs', _jFiles, note, (i,n)=>{
      show('var(--amber)', n>1
        ? '⏳ 서류가 많아 '+n+'번에 나눠 보냅니다 — '+i+'/'+n+' 묶음 분석 중... (묶음당 10~30초)'
        : '⏳ AI가 서류를 읽는 중입니다... (10~30초)');
    });
    const d=r.data||{};
    const el=(id,v)=>{ const e=document.getElementById(id); if(e && v) e.value=v; };
    const filled=[];
    if(d.bizName){ el('j_bizName',d.bizName); filled.push('회사명'); }
    if(d.ceo){ el('j_ceo',d.ceo); filled.push('대표자'); }
    const biz=[d.mainProduct||'', d.researchTopic||''].filter(Boolean).join(' / ');
    if(biz){ el('j_biz',biz); filled.push('업종·주요제품'); }
    if(Array.isArray(d.people)&&d.people.length){
      const names=d.people.filter(p=>p.role!=='manage').map(p=>p.name).filter(Boolean);
      if(names.length){ el('j_people',names.join(', ')); filled.push('연구원 '+names.length+'명'); }
    }
    if(d.foundLabDate){ el('j_approve',d.foundLabDate); el('j_start',String(d.foundLabDate).slice(0,7)); filled.push('인정일'); }
    const dp=document.getElementById('j_dept');
    if(dp){ dp.value = (d.labType==='lab'||/연구소/.test(d.labName||'')) ? '기업부설연구소' : '연구개발전담부서'; }
    // 연구과제
    let tasks='';
    if(d.overview && Array.isArray(d.overview.tasks) && d.overview.tasks.length){
      tasks=d.overview.tasks.map(t=>[t.n,t.c].filter(Boolean).join(': ')).join('\n');
    } else if(d.researchTopic){ tasks=d.researchTopic; }
    if(tasks){ el('j_tasks',tasks); filled.push('연구과제'); }
    // 보고서에 쓸 장비 목록 보관
    _jParsedExtra={ equip:Array.isArray(d.equip)?d.equip:[], labName:d.labName||'', labAddr:d.labAddr||'', area:d.area||'' };

    const docs=(d.coverage&&Array.isArray(d.coverage.detectedDocs)&&d.coverage.detectedDocs.length)
      ? '<div style="font-size:11.5px;font-weight:700;color:var(--gray);margin-top:4px">📎 인식한 서류: '+d.coverage.detectedDocs.map(escapeHtml).join(', ')+'</div>' : '';
    const miss=[];
    if(!document.getElementById('j_approve')?.value) miss.push('인정일');
    if(!document.getElementById('j_people')?.value) miss.push('연구원');
    if(!document.getElementById('j_biz')?.value) miss.push('업종·주요제품');
    show('var(--blue)','✅ 자동 입력 완료 — '+(filled.join(' · ')||'읽은 항목 없음')
      +(_jParsedExtra.equip.length?' · 장비 '+_jParsedExtra.equip.length+'종':'')+docs
      +(miss.length?'<div style="color:var(--red);margin-top:5px">⚠️ 못 읽은 항목: <b>'+miss.join(', ')+'</b> — 아래 칸에 직접 채워주세요</div>':'')
      +'<div style="color:#234;margin-top:5px;font-weight:700">아래 내용을 확인·수정한 뒤 [업체 등록하기]를 누르세요.</div>');
  }catch(e){
    show('var(--red)','❌ '+escapeHtml(e.message));
  }
  if(btn){btn.disabled=false;btn.style.opacity='1';}
}

/* ---- 서버 없이 즉시 등록 (설립 완료 업체용) ---- */
function jQuickRegister(){
  const f=jFormVals();
  if(!f.bizName){ alert('회사명을 입력하세요.'); return; }
  if(!f.people){ alert('연구원 이름을 최소 1명 입력하세요. (보고서 기록자 서명란에 들어갑니다)'); return; }
  // 시작 시점: 인정일 우선
  let startYm = f.approve ? f.approve.slice(0,7) : (f.start || (new Date().getFullYear()+'-01'));
  const year = parseInt(startYm.slice(0,4));
  const m0 = parseInt(startYm.slice(5,7))||1;
  const first=(f.people.split(',')[0]||'').trim();

  // 과제 → 주요내용(대주제) + 소주제 자동 분해
  let bigs=f.tasks.split('\n').map(s=>s.replace(/^\s*\d+[.)]\s*/,'').trim()).filter(Boolean);
  if(!bigs.length){
    const b=f.biz||'주요 제품';
    bigs=[b+' 품질 향상 연구', b+' 공정·조건 최적화 연구', b+' 보관·안정성 개선 연구'];
  }
  const subTpl=['현황 조사 및 기준값 설정','시험 조건 설계 및 시제품 제작','측정·시험 및 결과 정리','문제점 분석 및 개선안 적용'];
  // "과제명: 설명" 형태면 앞은 대주제, 뒤는 소주제로 분리
  const mainContents=bigs.slice(0,3).map(b=>{
    const m=b.split(/\s*[:：]\s*/);
    const title=(m[0]||b).trim();
    const desc=m.slice(1).join(': ').trim();
    return {big:title, subs:(desc?[desc]:[]).concat(subTpl).slice(0,4)};
  });

  // 12개월 배분표 (시작월부터)
  const flat=[]; mainContents.forEach(mc=>mc.subs.forEach(s=>flat.push(mc.big+' — '+s)));
  const monthlyPlan=[];
  for(let i=0;i<12;i++){
    const mm=((m0-1+i)%12)+1;
    monthlyPlan.push({month:mm, sub:flat[i%flat.length]});
  }
  monthlyPlan.sort((a,b)=>a.month-b.month);

  const plan={
    company:f.bizName, ceo:f.ceo, year:year,
    projectTitle:(f.biz? f.biz+' 품질·공정 개선 연구' : bigs[0]),
    director:first, goal:'현재 제품·공정에서 나타나는 문제를 찾아 원인을 확인하고, 시험을 통해 개선 조건을 정리해 사업화 전 단계까지 검증한다.',
    people:f.people, mainContents, monthlyPlan,
    startDate:startYm+'-01', dept:f.dept, manpower:String(f.people.split(',').filter(Boolean).length),
    budget:'자체 부담', noteWriter:first, noteCycle:'분기 1회 작성(월별 진행내용 구분 기재)',
    labApproved:f.approve||'', startYm:startYm, bizDesc:f.biz, planPaste:f.planPaste||'', quick:true,
    equipList:(_jParsedExtra&&_jParsedExtra.equip&&_jParsedExtra.equip.length)?_jParsedExtra.equip
              :((D.equip||[]).filter(e=>e&&e.name))
  };
  J.companies[f.bizName]={ plan, notes:(J.companies[f.bizName]?.notes)||{} };
  J.cur=f.bizName; J._addNew=false; _jFiles=[]; jSave(); jCloudPush(f.bizName);
  alert('['+f.bizName+'] 등록 완료!\n아래 [연구개발보고서·노트 생성]에서 분기를 선택해 만드세요.');
  render();
}

    const plan=r.data; plan.ceo=ceo; plan.people=people; plan.startYm=start;

/* 작성 단위 전환 — 분량 옵션·버튼·종료일 자동 갱신 */
const JVOL={
  month:[['0.7','짧게 (약 4장)'],['1','표준 (약 5~6장 · 권장)'],['1.3','길게 (약 8장)']],
  quarter:[['0.7','짧게 (약 10장)'],['1','표준 (약 15장 · 권장)'],['1.3','길게 (약 19장)']],
  range:[['0.5','짧게'],['0.7','표준 (권장)'],['1','길게']]
};
function jCurKey(){
  const u=document.getElementById('j_unit')?.value||'month';
  if(u==='quarter') return document.getElementById('j_q')?.value||'';
  if(u==='range'){
    const a=document.getElementById('j_r1')?.value||'', b=document.getElementById('j_r2')?.value||'';
    if(!a||!b) return '';
    return jRangeParse(a+'~'+b) ? (a+'~'+b) : '';
  }
  return document.getElementById('j_ym')?.value||'';
}
function jSwitchUnit(u){
  const e=document.getElementById('j_unit'); if(e){ e.value=u; }
  jSyncUnit();
  const t=document.getElementById(u==='month'?'jChkM':'jChkQ');
  if(t) t.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function jSyncUnit(){
  const u=document.getElementById('j_unit')?.value||'month';
  const isM=u==='month', isR=u==='range';
  const w1=document.getElementById('j_ymWrap'), w2=document.getElementById('j_qWrap'), w3=document.getElementById('j_rWrap');
  if(w1) w1.style.display=isM?'':'none';
  if(w2) w2.style.display=(u==='quarter')?'':'none';
  if(w3) w3.style.display=isR?'':'none';
  const cm=document.getElementById('jChkM'), cq=document.getElementById('jChkQ');
  if(cm) cm.style.display=isM?'':'none';
  if(cq) cq.style.display=(u==='quarter')?'':'none';
  const sel=document.getElementById('j_vol');
  if(sel){
    const keep=sel.value||'1';
    sel.innerHTML=(JVOL[u]||JVOL.quarter).map(([v,t])=>`<option value="${v}" ${v===keep?'selected':''}>${t}</option>`).join('');
    if(!sel.value) sel.value='1';
  }
  const rk=isR?jCurKey():'';
  const rn=rk?jPeriod(rk).months.length:0;
  const rmsg=document.getElementById('j_rMsg');
  if(rmsg) rmsg.style.display=isR?'block':'none';
  if(rmsg && isR){
    const a=document.getElementById('j_r1')?.value||'', b=document.getElementById('j_r2')?.value||'';
    if(!a||!b) rmsg.innerHTML='시작 월과 끝 월을 모두 고르세요.';
    else if(!rk) rmsg.innerHTML='<span style="color:var(--red)">끝 월이 시작 월보다 빠릅니다.</span>';
    else rmsg.innerHTML='<b style="color:var(--blue-d)">'+jKeyLabel(rk)+'</b> ('+rn+'개월) 한 장으로 작성합니다.'
      +(rn>1?' 본문에 <b>월별 진행 내용</b> 표가 들어갑니다.':'');
  }
  const bd=document.getElementById('jUnitBadge');
  if(bd) bd.textContent = isM?'A4 5~6장 분량':(isR?('A4 '+Math.max(5,rn*5)+'장 분량'):'A4 15장 분량');
  const btn=document.getElementById('jNoteBtn');
  if(btn && !btn.disabled) btn.textContent = isM?'노트 생성 (약 3분)':(isR?('보고서 생성 (약 '+Math.max(3,rn*3)+'분)'):'보고서 생성 (약 6분)');
  // 종료일 표시 + 시작일 저장
  const key=jCurKey();
  const sd=document.getElementById('j_startDate')?.value||'';
  if(key){
    const per=jPeriod(key, sd);
    const ed=document.getElementById('j_endDate');
    if(ed) ed.value=`${per.ey}-${String(per.em).padStart(2,'0')}-${String(per.ed).padStart(2,'0')}`;
    const co=J.companies[J.cur];
    if(co && sd){ co.startDates=co.startDates||{}; co.startDates[key]=sd; try{jSave();}catch(e){} }
  }
}

function jSetMonthSub(month, v){
  const co=J.companies[J.cur]; if(!co||!co.plan) return;
  const p=co.plan;
  p.monthlyPlan=p.monthlyPlan||[];
  if(!p._mpOrig){ try{ p._mpOrig=JSON.parse(JSON.stringify(p.monthlyPlan)); }catch(e){} }
  const nv=String(v||'').trim();
  const it=p.monthlyPlan.find(x=>+x.month===+month);
  if(it) it.sub=nv; else p.monthlyPlan.push({month:+month, sub:nv});
  p.monthlyPlan.sort((a,b)=>(+a.month)-(+b.month));
  jSave(); try{ jCloudPush(J.cur); }catch(e){}
  render();
  setTimeout(()=>{ const d=document.querySelector('.card details'); if(d) d.open=true; },40);
}
function jResetMonthPlan(){
  const co=J.companies[J.cur]; if(!co||!co.plan||!co.plan._mpOrig) return;
  if(!confirm('직접 고친 세부주제가 모두 사라지고 처음 만들어진 배분표로 돌아갑니다. 계속할까요?')) return;
  co.plan.monthlyPlan=JSON.parse(JSON.stringify(co.plan._mpOrig));

}
function jEditField(field, label){

/* 인정일(또는 시작월)부터 현재 분기까지 써야 할 분기 목록 */
function jQuarterList(co){
  const p=co.plan||{};
  const sd = p.labApproved || p.startYm || p.startDate || (p.year? p.year+'-01-01':'');
  if(!sd) return [];
  let y=parseInt(sd.slice(0,4)); const mm=parseInt(sd.slice(5,7))||1;
  if(!y) return [];
  let q=Math.floor((mm-1)/3)+1;
  const now=new Date(), ny=now.getFullYear(), nq=Math.floor(now.getMonth()/3)+1;
  const out=[]; let guard=0;
  while((y<ny || (y===ny && q<=nq)) && guard++<40){ out.push(y+'-Q'+q); q++; if(q>4){q=1;y++;} }
  return out;
}

/* 인정일(또는 시작월)부터 이번 달까지의 월 키 목록 */
function jMonthList(co){
  const p=co.plan||{};
  const sd = p.labApproved || p.startYm || p.startDate || (p.year? p.year+'-01-01':'');
  if(!sd) return [];
  let y=parseInt(sd.slice(0,4)); let m=parseInt(sd.slice(5,7))||1;
  if(!y) return [];
  const now=new Date(), ny=now.getFullYear(), nm=now.getMonth()+1;
  const out=[]; let guard=0;
  while((y<ny || (y===ny && m<=nm)) && guard++<60){
    out.push(y+'-'+String(m).padStart(2,'0')); m++; if(m>12){m=1;y++;}
  }
  return out;
}
/* 체크리스트에서 회차를 고르면 작성 단위·기간을 맞춰 세팅하고 알맞은 화면으로 */
function jSetPeriodFields(k){
  if(!k) return;
  const rg=jRangeParse(k);
  const u=document.getElementById('j_unit');
  if(rg){
    if(u) u.value='range';
    const a=document.getElementById('j_r1'), b=document.getElementById('j_r2');
    const parts=k.split('~');
    if(a) a.value=parts[0]; if(b) b.value=parts[1];
    try{ jSyncUnit(); }catch(e){}
    return;
  }
  const isQ=/-Q/.test(k);
  if(u){ u.value=isQ?'quarter':'month'; }
  if(isQ){
    const e=document.getElementById('j_q');
    if(e){
      if(!Array.prototype.some.call(e.options,o=>o.value===k)){
        const o=document.createElement('option');
        o.value=k; o.textContent=jKeyLabel(k);
        e.appendChild(o);
      }
      e.value=k;
    }
  }else{
    const e=document.getElementById('j_ym'); if(e) e.value=k;
  }
  try{ jSyncUnit(); }catch(e){}
}
function jPickPeriod(k){
  jSetPeriodFields(k);
  const co=J.companies[J.cur]; const n=co&&co.notes&&co.notes[k];
  if(n && n.content){ J._forceGuide=null; jViewNote(k); return; }
  if(n && n.photoGuide && n.photoGuide.length){ J._forceGuide=k; jViewNote(k); return; }
  jPreGuide(k);
}

/* 기간 키 해석: '2026-07'(월간) 또는 '2026-Q3'(분기) */
/* '2026-06~2026-07' 형태의 직접 지정 기간 */
function jRangeParse(k){
  const m=String(k||'').match(/^(\d{4})-(\d{2})~(\d{4})-(\d{2})$/);
  if(!m) return null;
  const r={y1:+m[1], m1:+m[2], y2:+m[3], m2:+m[4]};
  if(r.y2<r.y1 || (r.y2===r.y1 && r.m2<r.m1)) return null;
  return r;
}
/* 기간 키 → 사람이 읽는 이름 */
function jKeyLabel(k){
  const rg=jRangeParse(k);
  if(rg) return rg.y1===rg.y2 ? (rg.y1+'년 '+rg.m1+'~'+rg.m2+'월')
                              : (rg.y1+'년 '+rg.m1+'월~'+rg.y2+'년 '+rg.m2+'월');
  if(/-Q/.test(k)) return k.split('-')[0]+'년 '+k.split('-Q')[1]+'분기';
  const pp=k.split('-');
  return pp[0]+'년 '+parseInt(pp[1],10)+'월';
}

function jPeriod(key, startOverride){
  const K=(y,m,d)=>`${y}년 ${String(m).padStart(2,'0')}월 ${String(d).padStart(2,'0')}일`;
  const _rg=jRangeParse(key);
  if(_rg){
    const lastDay=new Date(_rg.y2,_rg.m2,0).getDate();
    const months=[]; let ry=_rg.y1, rm=_rg.m1, guard=0;
    while((ry<_rg.y2||(ry===_rg.y2&&rm<=_rg.m2)) && guard++<24){ months.push(rm); rm++; if(rm>12){rm=1;ry++;} }
    const o0={quarter:months.length>1, custom:true, yy:String(_rg.y1), m1:_rg.m1, m2:_rg.m2,
      label:jKeyLabel(key),
      sy:_rg.y1, sm:_rg.m1, sd:1, ey:_rg.y2, em:_rg.m2, ed:lastDay,
      endDate:`${String(_rg.y2).slice(2)}. ${String(_rg.m2).padStart(2,'0')}. ${lastDay}.`, months};
    if(startOverride && /^\d{4}-\d{2}-\d{2}$/.test(startOverride)){
      const sy=parseInt(startOverride.slice(0,4)), sm=parseInt(startOverride.slice(5,7)), sd=parseInt(startOverride.slice(8,10));
      const _after=(sy>o0.sy)||(sy===o0.sy&&sm>=o0.sm);
      const _before=(sy<o0.ey)||(sy===o0.ey&&(sm<o0.em||(sm===o0.em&&sd<=o0.ed)));
      if(_after && _before){
        o0.sy=sy; o0.sm=sm; o0.sd=sd; o0.customStart=true;
        const f=o0.months.filter(m=>!(sy===o0.ey&&m<sm));
        o0.months=f.length?f:[o0.em];
      }
    }
    o0.range=`${K(o0.sy,o0.sm,o0.sd)} ~ ${K(o0.ey,o0.em,o0.ed)}`;
    o0.startDate=`${o0.sy}-${String(o0.sm).padStart(2,'0')}-${String(o0.sd).padStart(2,'0')}`;
    return o0;
  }
  const [yy,part]=key.split('-');
  let o;
  if(part.startsWith('Q')){
    const q=parseInt(part[1]); const m1=(q-1)*3+1, m2=q*3;
    const lastDay=new Date(parseInt(yy),m2,0).getDate();
    o={quarter:true,q,yy,m1,m2,label:yy+'년 '+q+'분기',
      sy:parseInt(yy), sm:m1, sd:1, ey:parseInt(yy), em:m2, ed:lastDay,
      endDate:`${yy.slice(2)}. ${String(m2).padStart(2,'0')}. ${lastDay}.`, months:[m1,m1+1,m2]};
  }else{
    const mm=parseInt(part); const lastDay=new Date(parseInt(yy),mm,0).getDate();
    o={quarter:false,yy,m1:mm,m2:mm,label:yy+'년 '+mm+'월',
      sy:parseInt(yy), sm:mm, sd:1, ey:parseInt(yy), em:mm, ed:lastDay,
      endDate:`${yy.slice(2)}. ${part}. ${lastDay}.`, months:[mm]};
  }
  // 실제 연구 시작일이 지정되면 시작 지점만 교체 (기간 안에 있을 때만)
  if(startOverride && /^\d{4}-\d{2}-\d{2}$/.test(startOverride)){
    const sy=parseInt(startOverride.slice(0,4)), sm=parseInt(startOverride.slice(5,7)), sd=parseInt(startOverride.slice(8,10));
    const notBefore = (sy>o.sy) || (sy===o.sy && sm>=o.sm);
    const inRange = notBefore && ((sy<o.ey) || (sy===o.ey && (sm<o.em || (sm===o.em && sd<=o.ed))));
    if(inRange){
      o.sy=sy; o.sm=sm; o.sd=sd; o.customStart=true;
      o.months = o.months.filter(m => !(sy===o.ey && m<sm));
      if(!o.months.length) o.months=[o.em];
    }
  }
  o.range = `${K(o.sy,o.sm,o.sd)} ~ ${K(o.ey,o.em,o.ed)}`;
  o.startDate = `${o.sy}-${String(o.sm).padStart(2,'0')}-${String(o.sd).padStart(2,'0')}`;
  return o;
}
/* ---- 연구원 이름 (맨 앞 = 연구소장, 나머지 = 연구보조원) ---- */
const JUNK_NAME=/^(연구원|참여\s*인력|인력|연구\s*인력|담당\s*연구원|참여\s*연구원|전담\s*요원)?\s*\d+\s*명$/;
function jCleanNames(raw){
  return String(raw||'').split(/[,、·\/\n]+/).map(s=>s.replace(/\(.*?\)/g,'').trim())
    .filter(s=>s && !JUNK_NAME.test(s) && !/^(담당\s*연구원|연구원|미기재|미입력|없음|해당\s*없음)$/.test(s));
}
function jNames(p){
  p=p||{};
  const el=document.getElementById('j_people2');
  let n = (el && el.value.trim()) ? jCleanNames(el.value) : [];
  if(!n.length) n=jCleanNames(p.people);
  if(!n.length) n=jCleanNames(p.director);
  if(!n.length) n=jCleanNames(p.noteWriter);
  return n;
}
function jDirector(p){ return jNames(p)[0]||''; }
function jPeopleLine(p){
  const n=jNames(p);
  if(!n.length) return '';
  return n.map((nm,i)=>(i===0?'연구소장 ':'연구보조원 ')+nm).join(', ');
}

/* 예전에 저장된 "연구원 2명" 같은 값 정리 */
function jMigrateNames(){
  let ch=false;
  Object.values(J.companies||{}).forEach(co=>{
    if(!co) return;
    if(co.plan && co.plan.people && !jCleanNames(co.plan.people).length){ co.plan.people=''; ch=true; }
    Object.values(co.notes||{}).forEach(n=>{
      if(n && n.participants && !jCleanNames(n.participants).length){ n.participants=''; ch=true; }
    });
  });
  if(ch){ try{jSave();}catch(e){} }
}

/* ---- 전체 연구개발기간 (보고서 머리글용) ---- */
function jTotalDefaults(p){
  p=p||{};
  const y=p.year||new Date().getFullYear();
  return { s:(p.totalStart||(y+'-01-01')), e:(p.totalEnd||(y+'-12-31')) };
}
function jTotalText(p){
  const t=jTotalDefaults(p);
  const f=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||''); return m?`${m[1]}년 ${m[2]}월 ${m[3]}일`:'';};
  const a=f(t.s), b=f(t.e);
  return (a&&b)?(a+' ~ '+b):'';
}
function jSaveTotalPeriod(){
  const co=J.companies[J.cur]; if(!co||!co.plan) return;
  const s=(document.getElementById('j_totalStart')?.value||'');
  const eEl=document.getElementById('j_totalEnd');
  if(s && eEl && (!eEl.value || eEl.value<s)){
    let auto=s.slice(0,4)+'-12-31';
    if(auto<s){ auto=(parseInt(s.slice(0,4))+1)+'-'+s.slice(5,7)+'-'+s.slice(8,10); }
    eEl.value=auto;
  }
  co.plan.totalStart=s;
  co.plan.totalEnd=eEl?eEl.value:'';
  try{jSave();}catch(err){}
  const pv=document.getElementById('j_totalPreview');
  if(pv) pv.textContent=jTotalText(co.plan)||'(날짜를 모두 입력하세요)';
}

/* 현재 회사·기간의 시작일 (입력값 → 저장값 → 없음) */
function jStartOf(key){
  const el=document.getElementById('j_startDate');
  if(el && el.value) return el.value;
  const co=J.companies[J.cur];
  return (co && co.startDates && co.startDates[key]) || '';
}
function jPrevKey(key){
  const rg=jRangeParse(key);
  if(rg){
    const d=new Date(rg.y1, rg.m1-2, 1);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }
  const [yy,part]=key.split('-');
  if(part.startsWith('Q')){ const q=parseInt(part[1]); return q>1? yy+'-Q'+(q-1) : (parseInt(yy)-1)+'-Q4'; }
  const d=new Date(parseInt(yy),parseInt(part)-2,1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}

   좋은 예: "이 제품은 보관 온도가 조금만 달라져도 겉면 상태가 크게 달라진다."
   → 회사 소개 없이 대상 제품과 현상부터 바로 쓰세요. 회사 이름을 본문에 넣지 마세요.
   → 대상 제품은 위 [연구계획서 요약]의 업종·주요제품과 연구과제명에 적힌 것만 쓰세요.
     계획서에 없는 수식어(수입산·국내산·중국산 등 원산지, 제조 방식)를 임의로 붙이지 마세요.
2) 사람 이름·직책·"연구원이" 같은 주어 금지.
   나쁜 예: "김위가 저울로 무게를 재고, 하철학이 pH를 측정하였다."
   좋은 예: "작업대에서 저울로 무게를 재고, 이어서 pH를 측정하였다."
   → 누가 했는지는 아예 쓰지 말고 주어를 생략하세요.
3) 구체적인 날짜·주차 금지.
   나쁜 예: "7월 8일 오전에", "8월 3주차에", "9월 마지막 주에"
   좋은 예: "이번 기간에는", "먼저", "그다음", "이어서", "기간 중반부터", "마지막으로"
   → 월 단위 표기도 꼭 필요한 경우가 아니면 쓰지 마세요.

[작성 원칙 — 4가지가 드러나게]
날짜와 사람 대신 아래 4가지가 드러나게 쓰세요.
- 어디서: 연구실 작업대, 보관실, 사무실 등 실제 있을 법한 장소
- 무엇을: 대상 시료와 측정 항목
- 어떻게: 사용한 장비와 방법
- 왜: 무엇을 확인하기 위해서였는지
예: "먼저 작업대에서 시료 세 개를 저울에 하나씩 올려 무게를 재었다.
보관 기간이 길어질수록 수분이 얼마나 줄어드는지 숫자로 확인하기 위해서였다."

    guideEdited:!!_prev.guideEdited,
    ym:key, photos:(_prev.photos||[])
  };
  note.realMemo=_prev.realMemo||'';
  const _moved=jRemapPhotos(note);              // 본문이 생겼으니 사진을 항목별로 배치
  co.notes[key]=note; jSave(); jCloudPush(J.cur);
  const chars=content.replace(/\s/g,'').length;
  if(!failed.length){
    show('var(--blue)',per.label+' 생성 완료! (본문 약 '+chars.toLocaleString()+'자)');
  }else{
    show('var(--red)',per.label+' 일부만 작성됐습니다 (본문 약 '+chars.toLocaleString()+'자).<br>'
      +'<span style="font-size:12px">빠진 항목: <b>'+escapeHtml(failed.join(', '))+'</b> — 아래 [분량] 을 <b>짧게</b>로 바꾼 뒤 다시 생성해 보세요.</span>');
  }
  unlock();
  if(!silent){
    if(failed.length){
      alert('일부 항목을 만들지 못했습니다.\n\n빠진 항목: '+failed.join(', ')
        +'\n\n[분량]을 "짧게"로 바꾼 뒤 같은 분기를 다시 생성하면 대부분 해결됩니다.\n(지금까지 작성된 내용은 저장돼 있습니다)');
    }
    render(); setTimeout(()=>jViewNote(key),80);
  }
  return !failed.length;
}

/* ---- 미작성 분기 일괄 생성 ---- */
async function jGenAllMissing(unit){
  const co=J.companies[J.cur]; if(!co||!co.plan) return;
  const isQ=(unit||'quarter')==='quarter';
  const unitName=isQ?'분기':'월';
  const list=isQ?jQuarterList(co):jMonthList(co);
  const missing=list.filter(k=>!(co.notes[k]&&co.notes[k].content));
  if(!missing.length){ alert('미작성 '+unitName+'이 없습니다.'); return; }
  if(!jWorkerBase()){ alert('서버 주소가 없습니다.\n연구일지 첫 카드의 [⚙️ 서버 주소 설정]을 열어 주소를 저장하세요.'); return; }
  const lblOf=k=>jKeyLabel(k);
  if(!confirm(missing.length+'개 '+unitName+' 노트를 순서대로 만듭니다.\n'
    +missing.map(lblOf).join(', ')+'\n\n약 '+(missing.length*(isQ?6:3))+'분 걸립니다. 진행할까요?')) return;
  const bs=document.getElementById('jBulkStatus'+(isQ?'Q':'M'));
  const put=(c,h)=>{ if(bs){bs.style.display='block';bs.style.color=c;bs.innerHTML=h;} };
  let ok=0;
  for(let i=0;i<missing.length;i++){
    const k=missing[i];
    put('var(--amber)','('+(i+1)+'/'+missing.length+') '+lblOf(k)+' 작성 중... 창을 닫지 마세요');
    const r=await jGenerateNote(k, true);
    if(r) ok++; else { put('var(--red)','('+(i+1)+'/'+missing.length+') '+lblOf(k)+' 실패 — 여기까지 '+ok+'개 저장됨. 잠시 후 다시 시도하세요.'); break; }
  }
  const last=missing[ok-1];
  if(ok===missing.length) alert('완료! '+ok+'개 '+unitName+' 노트를 만들었습니다.\n버튼을 눌러 내용을 확인하고, 사진을 넣은 뒤 인쇄하세요.');
  render(); if(last) setTimeout(()=>{ jSetPeriodFields(last); jViewNote(last); },120);
}

/* ---- 그래프 블록 → SVG 막대그래프 ---- */
function jGraphSvg(title, unit, items){
  const W=560, barH=26, gap=12, padL=150, padR=70, padT=34, padB=10;
  const H=padT+items.length*(barH+gap)-gap+padB;
  const maxV=Math.max(...items.map(x=>x.v),1);
  let bars='';
  items.forEach((it,i)=>{
    const y=padT+i*(barH+gap);
    const w=Math.max(4,(W-padL-padR)*(it.v/maxV));
    bars+=`<text x="${padL-8}" y="${y+barH/2+4}" text-anchor="end" font-size="12" font-weight="600" fill="#222">${escapeHtml(it.k)}</text>`
        +`<rect x="${padL}" y="${y}" width="${w}" height="${barH}" rx="4" fill="#0A84FF"/>`
        +`<text x="${padL+w+6}" y="${y+barH/2+4}" font-size="12" font-weight="800" fill="#0060df">${it.v}${escapeHtml(unit||'')}</text>`;
  });
  return `<div class="jn-graph"><svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;display:block">`
    +`<text x="${W/2}" y="18" text-anchor="middle" font-size="13" font-weight="900" fill="#111">${escapeHtml(title||'측정 결과')}</text>${bars}</svg></div>`;
}

/* ---- 본문 섹션 목록 (# 제목) ---- */
function jSectionsOf(content){
  const out=[];
  (content||'').split('\n').forEach(L=>{ const m=L.match(/^#\s+(.+)$/); if(m) out.push(m[1].trim()); });
  if(out.length) return out;
  // 큰 항목(#)이 하나도 없는 예전 본문은 종전대로 소제목까지 인정
  (content||'').split('\n').forEach(L=>{ const m=L.match(/^#{1,3}\s+(.+)$/); if(m) out.push(m[1].trim()); });
  return out;
}
/* 파일 이름에서 장면 번호 읽기.
   맨 앞 번호(1.jpg, 3_저울.jpg) 또는 확장자 바로 앞 번호(사진-2.jpg)만 인정한다.
   KakaoTalk_20260731_1234.jpg 처럼 날짜가 섞인 이름은 번호 없음으로 본다. */
function jSeqFromName(name){
  const s=String(name||'').replace(/\.[a-z0-9]+$/i,'');
  let m=s.match(/^\D{0,3}(\d{1,2})(?!\d)/);           // 맨 앞 (앞에 기호 몇 개는 허용)
  if(!m) m=s.match(/(?:^|[^\d])(\d{1,2})$/);           // 맨 뒤
  if(!m) return null;
  const v=parseInt(m[1]);
  return (v>=1 && v<=20) ? v : null;
}
/* ---- 사진 크기 ---- */
const JPSZ={ s:{w:31,h:150,t:'작게'}, m:{w:48,h:220,t:'보통'}, l:{w:64,h:300,t:'크게'}, f:{w:100,h:430,t:'전체폭'} };
function jSizeOf(ph){ return JPSZ[(ph&&ph.size)||'m']||JPSZ.m; }
/* ---- 사진 블록 HTML (인쇄용, 버튼 없음) ---- */
function jPhotoBlock(photos, label){
  if(!photos || !photos.length) return '';
  return '<div class="jn-inphotos">'+(label?'<div class="jn-phcap">'+escapeHtml(label)+'</div>':'')
    +'<div class="jn-photos">'
    +photos.map(ph=>{ const z=jSizeOf(ph);
        return '<div class="jn-photo" style="width:'+z.w+'%"><img src="'+ph.data+'" style="max-height:'+z.h+'px"><div class="jn-cap">'+escapeHtml(ph.caption||'')+'</div></div>';
      }).join('')
    +'</div></div>';
}
/* ---- 장면 설명 → 사진 캡션 채우기 ----
   직접 고친 캡션(capManual)은 건드리지 않고, 비었거나 기본값인 것만 채운다. */
function jSyncCaptions(n, force){
  if(!n || !n.photos) return 0;
  const g=n.photoGuide||[]; let k=0;
  n.photos.forEach((ph,i)=>{
    if(!force && ph.capManual) return;
    let gi;
    if(ph.gi!=null && ph.gi>=0) gi=ph.gi;
    else if(ph.gi===null) return;                 // [장면 지정 안 함]은 건드리지 않음
    else gi=(ph.seq!=null)?ph.seq-1:i;            // 예전 자료 보정
    const e=g[gi]; if(!e) return;
    const t=String(e.caption||e.scene||'').trim().slice(0,70);
    if(!t) return;
    const cur=String(ph.caption||'').trim();
    if(force || !cur || cur==='연구활동'){ if(cur!==t){ ph.caption=t; k++; } }
  });
  return k;
}
function jResyncCaptions(ym){
  const n=J.companies[J.cur]?.notes?.[ym]; if(!n) return;
  if(!(n.photoGuide||[]).some(g=>String(g.caption||g.scene||'').trim())){
    alert('촬영 장면에 적힌 설명이 없습니다.\n먼저 장면 문장을 채워주세요.'); return;
  }
  if(!confirm('사진 설명을 촬영 장면 문장으로 모두 덮어씁니다.\n직접 고쳐 둔 설명도 바뀝니다. 계속할까요?')) return;
  const k=jSyncCaptions(n, true);
  n.photos.forEach(ph=>{ ph.capManual=false; });
  try{ jSave(); }catch(e){}
  jViewNote(ym);
  alert(k+'장의 설명을 장면 문장으로 바꿨습니다.');
}
/* 장면 번호(gi) → 순서 정렬. 장면이 없는 사진은 뒤로. */
function jSortPhotos(n){
  if(!n||!n.photos) return;
  n.photos.forEach((ph,k)=>{ ph._o=k; });
  n.photos.sort((a,b)=>{
    const av=(a.gi!=null&&a.gi>=0)?a.gi:((a.seq!=null)?a.seq-1:999);
    const bv=(b.gi!=null&&b.gi>=0)?b.gi:((b.seq!=null)?b.seq-1:999);
    return (av-bv) || (a._o-b._o);
  });
  n.photos.forEach(ph=>{ delete ph._o; });
}
function jSortPhotosBtn(ym){
  const n=J.companies[J.cur]?.notes?.[ym]; if(!n) return;
  jSortPhotos(n); try{ jSave(); }catch(e){} jViewNote(ym);
}
/* 사진 순서 바꾸기 (같은 항목 안에서의 앞뒤 순서가 이 배열 순서를 따름) */
function jMovePhoto(ym,i,d){
  const n=J.companies[J.cur]?.notes?.[ym]; if(!n||!n.photos) return;
  const a=n.photos, j=i+d;
  if(j<0||j>=a.length) return;
  const t=a[i]; a[i]=a[j]; a[j]=t;
  try{ jSave(); }catch(e){} jViewNote(ym);
}
/* 이 사진이 몇 번 장면인지 직접 지정 → 설명과 순서가 따라옴 */
function jSetPhotoScene(ym,i,v){
  const n=J.companies[J.cur]?.notes?.[ym]; if(!n||!n.photos||!n.photos[i]) return;
  const ph=n.photos[i];
  if(v===''||v==null){ ph.gi=null; ph.seq=null; }
  else{
    const gi=parseInt(v);
    ph.gi=gi; ph.seq=gi+1;
    if(!ph.capManual){
      const g=(n.photoGuide||[])[gi];
      ph.caption=g?String(g.caption||g.scene||'').slice(0,70):'';
    }
  }
  try{ jSave(); }catch(e){} jViewNote(ym);
}
function jSetAllSize(ym, sz){
  const n=J.companies[J.cur]?.notes?.[ym]; if(!n||!n.photos) return;
  n.photos.forEach(ph=>{ ph.size=sz; });
  try{ jSave(); }catch(e){}
  jViewNote(ym);
}

/* ---- 마크다운 표 → HTML (간단 렌더러) + 섹션별 사진 삽입 ---- */
function mdToHtml(md, photos){
  const bySec={};
  (photos||[]).forEach(ph=>{ const s=parseInt(ph.sec)||0; if(s>0){ (bySec[s]=bySec[s]||[]).push(ph); } });
  let secIdx=0;
  const lines=(md||'').split('\n');
  const hasBig=/^#\s+/m.test(md||'');
  const isSecHead=L=> hasBig ? /^#\s/.test(L) : /^#{1,3}\s/.test(L);   // 사진을 붙일 기준선
  let html='',i=0;
  while(i<lines.length){
    const L=lines[i];
    // 새 섹션 시작 → 직전 섹션의 사진을 먼저 붙인다
    if(/^#{1,3}\s/.test(L)){
      if(isSecHead(L)){
        if(secIdx>0) html+=jPhotoBlock(bySec[secIdx]);
        secIdx++;
      }
      html+='<div class="jn-h">'+escapeHtml(L.replace(/^#{1,3}\s/,'')).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')+'</div>';
      i++; continue;
    }
    // [그래프|제목|단위] 블록
    const gm=L.match(/^\s*\[그래프\|([^|\]]*)\|?([^|\]]*)\]\s*$/);
    if(gm){
      const items=[]; i++;
      while(i<lines.length){
        const m2=lines[i].match(/^\s*([^:：]+)[:：]\s*([0-9.,\-]+)/);
        if(!m2) break;
        items.push({k:m2[1].trim(), v:parseFloat(m2[2].replace(/,/g,''))||0}); i++;
      }
      if(items.length) html+=jGraphSvg(gm[1].trim(), gm[2].trim(), items);
      continue;
    }
    if(/^\s*\|/.test(L) && i+1<lines.length && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1])){
      // 표 시작
      const header=L.split('|').slice(1,-1).map(c=>c.trim());
      let rows=[]; i+=2;
      while(i<lines.length && /^\s*\|/.test(lines[i])){
        rows.push(lines[i].split('|').slice(1,-1).map(c=>c.trim())); i++;
      }
      html+='<table class="jn-table"><tr>'+header.map(h=>'<th>'+escapeHtml(h)+'</th>').join('')+'</tr>'
        + rows.map(r=>'<tr>'+r.map(c=>'<td>'+escapeHtml(c)+'</td>').join('')+'</tr>').join('') + '</table>';
      continue;
    }
    let t=escapeHtml(L);
    t=t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^\s*[-•]\s/.test(L)) t='<div class="jn-li">'+t.replace(/^\s*[-•]\s/,'· ')+'</div>';
    else if(t.trim()==='') t='<div style="height:9px"></div>';
    else {
      // "~였다." "~하였다." 처럼 문장이 끝나면 다음 줄로 넘김
      let sents=[t];
      try{ sents=t.split(/(?<=[가-힣][.!?])\s+/).filter(x=>x.trim()); }catch(e){ sents=[t]; }
      if(!sents.length) sents=[t];
      t=sents.map(x=>'<div class="jn-p">'+x+'</div>').join('');
    }
    html+=t; i++;
  }
  if(secIdx>0) html+=jPhotoBlock(bySec[secIdx]);
  return html;
}

  ['fridge',/냉장고|냉동고|보관고|창고|입고|적재|보관 상태|보관실/],
  ['micro',/현미경|확대|돋보기|자세히 관찰|정밀/],
  ['sample',/시료|샘플|지퍼백|봉투|라벨|포장/]
];
/* 장면 하나에 해당하는 후보 키를 우선순위대로 모두 반환 (중복 회피용) */
function jSceneKeys(t){
  const x=String(t||''), out=[];
  JSCENE_RULES.forEach(([k,re])=>{ if(re.test(x)) out.push(k); });
  out.push('generic');
  return out;
}
function jSceneKey(t){ return jSceneKeys(t)[0]; }

/* ---- 촬영 장면 중복 제거 ---- */
function jGuideGrams(s){
  const t=String(s||'').replace(/[\s.,·・\/\-()]/g,''), g=new Set();
  for(let i=0;i<t.length-1;i++) g.add(t.slice(i,i+2));
  return g;
}
function jGuideSim(a,b){
  const A=jGuideGrams(a), B=jGuideGrams(b);
  if(!A.size||!B.size) return 0;
  let hit=0; A.forEach(x=>{ if(B.has(x)) hit++; });
  return hit/(A.size+B.size-hit);
}
/* 본문에 근거가 있을 때만 채워 넣는 보충 장면 */
const JGUIDE_FILL=[
  {key:'thermo', need:/온습도|온도계|습도|보관실 온도/, scene:'보관 장소에 놓인 온습도계의 온도·습도 숫자를 확인하는 장면'},
  {key:'record', need:/기록지|손으로 적|수기|기록하였다/, scene:'측정한 값을 현장에서 기록지에 손으로 적는 장면'},
  {key:'sample', need:/지퍼백|밀폐용기|라벨/, scene:'시료를 지퍼백·밀폐용기에 나눠 담고 라벨을 붙이는 장면'},
  {key:'fridge', need:/냉장|냉동|보관실|보관고/, scene:'보관고 문을 열고 시료가 놓인 상태를 확인하는 장면'},
  {key:'desk', need:/PC|컴퓨터|정리 파일|표로 정리|입력/i, scene:'연구용 PC에서 측정값을 표로 정리하는 화면'},
  {key:'compare', need:/비교|조건별|나란히/, scene:'조건별 시료를 나란히 놓고 상태를 비교하는 장면'}
];
/* n.photoGuide 를 정리(중복 제거+보충)해 그대로 저장. 가이드 그림·사진 자동배치가 같은 목록을 쓰게 함 */
function jGuideList(n, want){
  const src=(n&&n.photoGuide)||[];
  if(n && n.guideEdited){ return src.filter(g=>String(g.scene||'').trim()); }
  const out=[], used=new Set();
  src.forEach(g=>{
    const scene=String(g.scene||g.caption||'').trim();
    if(!scene) return;
    if(out.some(o=>jGuideSim(o.scene,scene)>=0.62)) return;      // 문장이 사실상 같은 것 제거
    const keys=jSceneKeys(scene);
    const key=keys.find(k=>!used.has(k))||keys[0];               // 같은 유형이면 다른 유형으로 배정
    used.add(key);
    out.push({scene, caption:String(g.caption||'').trim(), key});
  });
  const body=String((n&&n.content)||'');
  JGUIDE_FILL.forEach(f=>{
    if(out.length>=want) return;
    if(used.has(f.key)) return;
    if(!f.need.test(body)) return;
    used.add(f.key);
    out.push({scene:f.scene, caption:'', key:f.key});
  });
  const cut=out.slice(0, want);
  const before=JSON.stringify(src.map(g=>[g.scene||g.caption||'', g.key||'']));
  const after=JSON.stringify(cut.map(g=>[g.scene, g.key]));
  if(n && before!==after){ n.photoGuide=cut; try{jSave();}catch(e){} }
  return cut;
}

/* 한글 줄바꿈 (글자 수 기준) */
function jWrapKo(str, max){
  const words=String(str||'').split(/(\s+)/);
  const lines=[]; let cur='';
  words.forEach(w=>{
    if((cur+w).replace(/\s/g,'').length>max && cur.trim()){ lines.push(cur.trim()); cur=w.replace(/^\s+/,''); }
    else cur+=w;
  });
  if(cur.trim()) lines.push(cur.trim());
  return lines.slice(0,3);
}

/* ---- 본문에서 실제 기록된 수치 뽑기 (표 우선, 없으면 문장에서) ---- */
function jRange(a, dec){
  if(!a||!a.length) return '';
  const f=v=>v.toFixed(dec);
  const mn=Math.min.apply(null,a), mx=Math.max.apply(null,a);
  return mn===mx ? f(mn) : f(mn)+'~'+f(mx);
}
function jMeasures(content){
  const lines=String(content||'').split('\n');
  const c={w:[],ph:[],temp:[],hum:[],score:[]};
  let rowCount=0;
  for(let i=0;i<lines.length;i++){
    if(!(/^\s*\|/.test(lines[i]) && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i+1]||''))) continue;
    const header=lines[i].split('|').slice(1,-1).map(s=>s.trim());
    const rows=[]; let j=i+2;
    while(j<lines.length && /^\s*\|/.test(lines[j])){ rows.push(lines[j].split('|').slice(1,-1).map(s=>s.trim())); j++; }
    if(header.some(h=>/시료|샘플/.test(h))) rowCount=Math.max(rowCount, rows.length);
    header.forEach((h,ci)=>{
      let k=null;
      if(/무게|중량/.test(h)) k='w';
      else if(/pH/i.test(h)) k='ph';
      else if(/온도/.test(h)) k='temp';
      else if(/습도/.test(h)) k='hum';
      else if(/점수|평점/.test(h)) k='score';
      if(!k) return;
      rows.forEach(r=>{
        const m=String(r[ci]||'').match(/-?\d+(?:\.\d+)?/);
        if(m) c[k].push(parseFloat(m[0]));
      });
    });
    i=j-1;
  }
  const grab=(re,arr)=>{ let m; while((m=re.exec(content))!==null){ const v=parseFloat(m[1]); if(!isNaN(v)) arr.push(v); } };
  if(!c.w.length)    grab(/(\d+(?:\.\d+)?)\s*g\b/g, c.w);
  if(!c.ph.length)   grab(/pH[^0-9\-]{0,15}(\d(?:\.\d+)?)/gi, c.ph);
  if(!c.temp.length) grab(/(-?\d+(?:\.\d+)?)\s*(?:°\s*C|℃)/g, c.temp);
  if(!c.hum.length)  grab(/(\d+(?:\.\d+)?)\s*%/g, c.hum);
  return {c, rowCount};
}
/* 장면 유형별로 카드에 넣을 "연구일지 기록값" 문구 */
function jMeasureHints(content){
  const {c, rowCount}=jMeasures(content);
  const h={};
  if(c.w.length)  h.weigh='무게 '+jRange(c.w,1)+' g';
  if(c.ph.length) h.probe='pH '+jRange(c.ph,1);
  const env=[];
  if(c.temp.length) env.push('온도 '+jRange(c.temp,1)+'°C');
  if(c.hum.length)  env.push('습도 '+jRange(c.hum,0)+'%');
  if(env.length){ h.thermo=env.join(' · '); h.fridge=env.join(' · '); }
  if(rowCount){ h.sample='시료 '+rowCount+'개'; h.compare='시료 '+rowCount+'개 비교'; }
  if(c.score.length) h.hand='관능 점수 '+jRange(c.score,1)+'점';
  const items=[];
  if(c.w.length) items.push('무게'); if(c.ph.length) items.push('pH');
  if(c.temp.length) items.push('온도'); if(c.hum.length) items.push('습도');
  if(items.length){ h.record='기록 항목 : '+items.join('·'); h.desk=h.record; }
  if(!h.weigh && c.w.length) h.weigh='무게 '+jRange(c.w,1)+' g';
  return h;
}

function jGuideSvg(n, per, company){

  let o=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="${F}">`;
  o+=`<rect width="${W}" height="${H}" fill="#ffffff"/>`;

  o+=`<rect x="${PAD+14}" y="148" width="474" height="28" rx="14" fill="#FFF0F0"/>`;
  o+=`<text x="${PAD+32}" y="167" font-size="14.5" font-weight="900" fill="${R}">사진 파일 이름을 1, 2, 3 … 번호로 저장해 주세요</text>`;

  items.forEach((it,i)=>{
    const col=i%2, row=Math.floor(i/2);
    const x=PAD+col*(CW+GAP), y=HEAD+row*(CH+GAP);
    const key=it.key||jSceneKey(it.scene);
    const img=jIll(key);
    const tip=(JSCENE_TIP[key]||JSCENE_TIP.generic);
    const title=(JSCENE_TITLE[key]||JSCENE_TITLE.generic);
    o+=`<rect x="${x}" y="${y}" width="${CW}" height="${CH}" rx="16" fill="#ffffff" stroke="#E1EAF6" stroke-width="2"/>`;
    o+=`<circle cx="${x+42}" cy="${y+44}" r="20" fill="${R}"/>`;
    o+=`<text x="${x+42}" y="${y+52}" font-size="22" font-weight="900" fill="#fff" text-anchor="middle">${it.no}</text>`;
    o+=`<text x="${x+74}" y="${y+52}" font-size="19.5" font-weight="900" fill="${T}">${jSvgEsc(title)}</text>`;
    /* 일러스트 */
    o+=`<rect x="${x+16}" y="${y+72}" width="${CW-32}" height="214" rx="12" fill="#F5FAFF"/>`;
    if(img) o+=`<image x="${x+16}" y="${y+74}" width="${CW-32}" height="210" href="${img}" preserveAspectRatio="xMidYMid meet"/>`;
    o+=`<path d="M${x+22} ${y+302} H${x+CW-22}" stroke="#E8EFF8" stroke-width="2"/>`;
    /* 설명 */
    jWrapKo(it.scene, 27).forEach((L,k)=>{
      o+=`<text x="${x+24}" y="${y+330+k*24}" font-size="15.5" font-weight="700" fill="#20303f">${jSvgEsc(L)}</text>`;
    });
    /* 연구일지에 기록된 실제 수치 */
    const hint=HINT[key]||'';
    if(hint){
      o+=`<rect x="${x+22}" y="${y+392}" width="${CW-44}" height="28" rx="8" fill="#EAF3FF"/>`;
      o+=`<text x="${x+34}" y="${y+411}" font-size="13.5" font-weight="800" fill="#0A5AD6">연구일지 기록값 · ${jSvgEsc(hint)}</text>`;
    }
    const tipY = hint ? y+426 : y+400;
    const fileY = hint ? y+468 : y+442;
    /* 팁 + 파일명 */
    o+=`<rect x="${x+22}" y="${tipY}" width="${CW-44}" height="27" rx="8" fill="#FFF3F3"/>`;
    o+=`<text x="${x+34}" y="${tipY+19}" font-size="13.5" font-weight="800" fill="${R}">촬영 팁 · ${jSvgEsc(tip)}</text>`;
    o+=`<text x="${x+24}" y="${fileY}" font-size="14.5" font-weight="900" fill="${T}">저장할 파일 이름 :  ${it.no}</text>`;

  o+=`</svg>`;
  return o;
}

function jDownloadGuidePng(ym){
  const wrap=document.getElementById('jGuideSvgWrap'); if(!wrap) return;
  const svgEl=wrap.querySelector('svg'); if(!svgEl) return;
  const W=parseInt(svgEl.getAttribute('width'))||880;
  const H=parseInt(svgEl.getAttribute('height'))||1200;
  const src=new XMLSerializer().serializeToString(svgEl);
  const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=W*2; c.height=H*2;
    const ctx=c.getContext('2d'); ctx.scale(2,2);
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    try{
      const a=document.createElement('a');
      a.href=c.toDataURL('image/png');
      a.download='촬영가이드_'+((J.companies[J.cur]?.plan?.company)||'업체')+'_'+ym+'.png';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ alert('저장에 실패했습니다. 화면을 캡처해서 보내주세요.'); }
  };
  img.onerror=()=>alert('그림 변환에 실패했습니다. 화면을 캡처해서 보내주세요.');
  img.src=url;
}

/* 본문의 "사용 장비 및 재료" 표에서 장비만 뽑기 */
function jEquipOf(n, plan){
  const out=[];
  const lines=String(n.content||'').split('\n');
  let inTbl=false, cols=[];
  for(let i=0;i<lines.length;i++){
    const L=lines[i].trim();
    if(/^#{1,3}\s*.*사용\s*장비/.test(L)){ inTbl=true; cols=[]; continue; }
    if(inTbl && /^#{1,3}\s/.test(L)) break;
    if(!inTbl) continue;
    if(!/^\|/.test(L)) continue;
    const c=L.split('|').slice(1,-1).map(x=>x.trim());
    if(!cols.length){ cols=c; continue; }
    if(/^-{2,}$/.test((c[0]||'').replace(/\s/g,''))) continue;
    const gi=cols.findIndex(x=>/구분/.test(x)), ni=cols.findIndex(x=>/품목|장비명|명칭/.test(x));
    const qi=cols.findIndex(x=>/수량/.test(x)), ui=cols.findIndex(x=>/용도/.test(x));
    const kind=gi>=0?c[gi]:'장비';
    const name=ni>=0?c[ni]:c[1]||c[0];
    if(!name) continue;
    if(gi>=0 && !/장비|기기|설비/.test(kind)) continue;   // 시료·소모품 제외
    out.push({name, qty:qi>=0?c[qi]:'', use:ui>=0?c[ui]:''});
  }
  if(out.length) return out.slice(0,12);
  return (plan&&plan.equipList||[]).filter(e=>e&&e.name).map(e=>({name:e.name, qty:e.qty?e.qty+'대':'', use:''})).slice(0,12);
}

/* 이번 회차 계획 문장에서 뽑는 단계별 장면 */
const JSCENE_PHASE=[
  {key:'base',    re:/현황|기준값|초기|조사/,        scene:'조건별 시료를 작업대에 나란히 놓고 초기 상태를 확인하는 장면', cap:'초기 상태 확인'},
  {key:'proto',   re:/설계|조건|시제품|제작|준비/,   scene:'시험 조건별로 시료를 나누어 준비하는 장면', cap:'시험 조건 준비'},
  {key:'measure', re:/측정|시험|결과 정리|데이터/,   scene:'계기판 숫자가 보이도록 측정값을 읽어 기록하는 장면', cap:'측정값 기록'},
  {key:'compare', re:/분석|개선|비교|문제|평가/,     scene:'앞선 결과와 이번 결과를 나란히 놓고 비교·검토하는 장면', cap:'결과 비교 검토'}
];
function jLocalGuide(p, per, want){
  const subs=(p.monthlyPlan||[]).filter(x=>per.months.includes(x.month))
    .map(x=>String(x.sub||'')).join(' ');
  const eqTxt=(p.equipList||[]).map(e=>e?((e.name||'')+' '+(e.use||'')):'').join(' ');
  const out=[], used=new Set();
  const push=t=>{ if(used.has(t.key)||out.length>=want) return; used.add(t.key); out.push({scene:t.scene, caption:t.cap}); };
  JSCENE_PHASE.forEach(t=>{ if(t.re.test(subs)) push(t); });   // 1순위: 이번 회차 단계
  JSCENE_EQ.forEach(t=>{ if(t.re.test(eqTxt)) push(t); });     // 2순위: 보유 장비
  JSCENE_EQ.forEach(t=>{ if(t.re.test(subs)) push(t); });      // 3순위: 계획 문장 속 장비
  JSCENE_PHASE.forEach(push);                                  // 4순위: 기본 단계
  JSCENE_EQ.forEach(push);                                     // 5순위: 기본 장비
  return out.slice(0, want);
}
function jPreGuide(forceKey){
  const co=J.companies[J.cur];
  const st=document.getElementById('jPreGuideStatus');
  const show=(c,h)=>{ if(st){st.style.display='block';st.style.color=c;st.innerHTML=h;} };
  if(!co||!co.plan){ show('var(--red)','업체를 먼저 등록하세요.'); return; }
  const key=forceKey||jCurKey();
  if(!key){ show('var(--red)','작성할 월(또는 분기)을 먼저 고르세요.'); return; }
  const p=co.plan;
  const per=jPeriod(key, jStartOf(key));
  const want=per.quarter?6:4;
  co.notes=co.notes||{};
  const prev=co.notes[key]||{};
  if(prev.content && !confirm(per.label+' 노트가 이미 있습니다.\n본문은 그대로 두고 촬영 장면만 새로 뽑을까요?')) return;
  if(prev.guideEdited && !confirm('직접 고쳐 놓은 촬영 장면이 있습니다.\n자동 장면으로 덮어쓸까요?')) return;
  const g=jLocalGuide(p, per, want);
  if(!g.length){ show('var(--red)','촬영 장면을 만들지 못했습니다. 계획서의 월별 배분표를 확인하세요.'); return; }
  co.notes[key]=Object.assign({}, prev, {
    ym:key, photoGuide:g, guideEdited:false, photos:prev.photos||[],
    content:prev.content||'', taskTitle:prev.taskTitle||p.projectTitle||'',
    subTitle:prev.subTitle||'', participants:prev.participants||jPeopleLine(p)||''
  });
  J._forceGuide=key;
  jSave(); jCloudPush(J.cur);
  show('var(--blue)','촬영 장면 '+g.length+'개를 만들었습니다. 아래에서 카톡 문구와 그림을 받으세요.');
  J._lastKey=key;
  render(); setTimeout(()=>{ jSetPeriodFields(key); jViewNote(key); },80);
}

/* ================= 촬영 장면 편집 ================= */
function jNoteOf(ym){ return J.companies[J.cur]?.notes?.[ym]; }
function jGuideRefresh(ym){ try{ jSave(); }catch(e){} jViewGuideStage(ym); }

function jSetGuide(ym,i,field,v){
  const n=jNoteOf(ym); if(!n||!n.photoGuide||!n.photoGuide[i]) return;
  n.photoGuide[i][field]=String(v||'').slice(0,220);
  n.guideEdited=true;
  if(field==='scene'||field==='caption'){
    const g=n.photoGuide[i];
    const t=String(g.caption||g.scene||'').trim().slice(0,70);
    if(t){
      (n.photos||[]).forEach((ph,k)=>{
        const gi=(ph.gi!=null&&ph.gi>=0)?ph.gi:((ph.seq!=null)?ph.seq-1:k);
        if(gi===i && !ph.capManual) ph.caption=t;
      });
    }
  }
  try{ jSave(); }catch(e){}
}
function jMoveGuide(ym,i,d){
  const n=jNoteOf(ym); if(!n) return;
  const g=n.photoGuide||[]; const j=i+d;
  if(j<0||j>=g.length) return;
  const t=g[i]; g[i]=g[j]; g[j]=t;
  (n.photos||[]).forEach(ph=>{ const gi=(ph.gi==null?-1:parseInt(ph.gi));
    if(gi===i) ph.gi=j; else if(gi===j) ph.gi=i; });
  n.guideEdited=true; jGuideRefresh(ym);
}
function jAddGuide(ym){
  const n=jNoteOf(ym); if(!n) return;
  n.photoGuide=n.photoGuide||[];
  if(n.photoGuide.length>=12){ alert('장면은 최대 12개까지입니다.'); return; }
  n.photoGuide.push({scene:'', caption:''});
  n.guideEdited=true; jGuideRefresh(ym);
}
function jDelGuide(ym,i){
  const n=jNoteOf(ym); if(!n||!n.photoGuide) return;
  if(!confirm((i+1)+'번 장면을 지울까요? (사진은 남습니다)')) return;
  n.photoGuide.splice(i,1);
  (n.photos||[]).forEach(ph=>{ const gi=(ph.gi==null?-1:parseInt(ph.gi));
    if(gi===i) ph.gi=null; else if(gi>i) ph.gi=gi-1; });
  n.guideEdited=true; jGuideRefresh(ym);
}
function jResetGuide(ym){
  const co=J.companies[J.cur]; const n=co?.notes?.[ym]; if(!n||!co.plan) return;
  if(!confirm('직접 고친 내용이 사라지고 자동 장면으로 돌아갑니다. 계속할까요?')) return;
  const per=jPeriod(ym, jStartOf(ym));
  n.photoGuide=jLocalGuide(co.plan, per, per.quarter?6:4);
  n.guideEdited=false;
  (n.photos||[]).forEach((ph,k)=>{ ph.gi=k; });
  jGuideRefresh(ym);
}
/* 받은 사진 장수에 맞춰 빈 장면 칸을 새로 짬 */
function jGuideFromPhotos(ym){
  const n=jNoteOf(ym); if(!n) return;
  const ph=n.photos||[];
  if(!ph.length){ alert('먼저 받은 사진을 올려주세요.'); return; }
  if(!confirm('사진 '+ph.length+'장에 맞춰 빈 장면 칸 '+ph.length+'개를 만듭니다.\n지금 장면 목록은 지워집니다. 계속할까요?')) return;
  n.photoGuide=ph.map(x=>({scene:'', caption:String(x.caption||'').slice(0,40)}));
  ph.forEach((x,k)=>{ x.gi=k; x.sec=jDefaultSec(n,k); });
  n.guideEdited=true; jGuideRefresh(ym);
}
/* 실측값을 메모칸으로 확정 이동 */
function jConfirmRead(ym,i){
  const n=jNoteOf(ym); if(!n||!n.photoGuide||!n.photoGuide[i]) return;
  const g=n.photoGuide[i];
  const v=String(g.read||'').trim();
  if(!v){ alert('옮길 값이 없습니다.'); return; }
  const line=(i+1)+'번 장면: '+v;
  const cur=String(n.realMemo||'').trim();
  if(cur.indexOf(line)<0) n.realMemo=(cur?cur+'\n':'')+line;
  g.readOk=true; jGuideRefresh(ym);
}

/* ---- AI가 사진을 직접 읽고 장면 초안 작성 ---- */
async function jAiGuide(ym){
  const co=J.companies[J.cur]; const n=co?.notes?.[ym]; if(!n) return;
  const base=jWorkerBase();
  const st=document.getElementById('jAiGuideMsg');
  const show=(c,h)=>{ if(st){st.style.display='block';st.style.color=c;st.innerHTML=h;} };
  if(!base){ show('var(--red)','서버 주소를 먼저 저장하세요.'); return; }
  const ph=(n.photos||[]).slice(0,8);
  if(!ph.length){ show('var(--red)','먼저 받은 사진을 올려주세요.'); return; }
  const btn=document.getElementById('jAiGuideBtn');
  if(btn){ btn.disabled=true; btn.style.opacity='.6'; }
  show('var(--amber)','⏳ AI가 사진 '+ph.length+'장을 읽는 중입니다... (10~30초)');

  const images=ph.map(x=>{
    const d=String(x.data||'');
    const m=d.match(/^data:([^;]+);base64,(.*)$/);
    return m?{media_type:m[1], data:m[2]}:null;
  }).filter(Boolean);

  const p=co.plan||{};
  const per=jPeriod(ym, jStartOf(ym));
  const prompt=`첨부한 사진 ${images.length}장은 어느 중소기업 연구개발전담부서에서 실제로 촬영한 연구활동 사진입니다.
회사 업종·주요제품: ${p.bizDesc||'(미기재)'}
연구과제: ${p.projectTitle||'(미기재)'}
작성 기간: ${per.label}

사진을 순서대로 하나씩 보고, 각 사진이 무슨 작업 장면인지 한 문장으로 적으세요.

[장면 문장 규칙]
- 사진에 실제로 보이는 것만 적으세요. 보이지 않는 장비·조건·작업을 지어내지 마세요.
- 사람 이름과 날짜를 넣지 마세요.
- 쉬운 우리말 한 문장. 예: "작업대에서 디지털 저울에 시료를 올려 무게를 재는 장면"
- caption은 사진 아래 들어갈 짧은 제목(15자 이내).

[숫자 읽기 규칙 — 매우 중요]
- 계기판·저울·측정기 화면에 숫자가 또렷하게 보이면 단위까지 그대로 적으세요.
- 흐리거나 가려져서 확신이 없으면 절대 추측하지 말고 빈칸으로 두세요.
- 숫자가 없는 사진은 빈칸입니다.

[응답 형식]
photoGuide 배열에 사진 순서대로 ${images.length}개를 넣으세요: [{"scene":"장면 문장","caption":"짧은 제목"}, ...]
content 에는 사진별로 읽은 숫자를 한 줄씩 적으세요. 형식은 "번호|값" 이며, 없으면 값을 비웁니다.
예:
1|저울 표시값 57.0 g
2|
3|온습도계 4℃ 62%

taskTitle 과 subTitle 은 빈 문자열로 두세요.
사진이 하나도 보이지 않으면 photoGuide를 빈 배열 []로 두고 content 를 정확히 NOIMAGE 라고만 쓰세요. 사진 없이 지어내면 안 됩니다.`;

  try{
    const resp=await fetch(base+'/generate-note',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({prompt, images})});
    const r=await resp.json();
    const d=(r&&r.data)||{};
    const body=String(d.content||r.content||'');
    const gl=Array.isArray(d.photoGuide)?d.photoGuide.filter(g=>g&&String(g.scene||'').trim()):[];
    if(/NOIMAGE/i.test(body) || !gl.length){
      localStorage.setItem('nmsc_vision','0');
      show('var(--red)','❌ 서버가 사진을 AI에게 넘기지 못했습니다. <b>[받은 사진 기준으로 장면 다시 짜기]</b>로 직접 적어주세요.<br><span style="font-weight:700;font-size:11.5px">워커에 이미지 전달 기능을 추가하면 이 버튼이 동작합니다.</span>');
      if(btn){ btn.disabled=false; btn.style.opacity='1'; }
      return;
    }
    localStorage.setItem('nmsc_vision','1');
    const reads={};
    body.split('\n').forEach(ln=>{
      const m=ln.match(/^\s*(\d{1,2})\s*[|:.]\s*(.*)$/);
      if(m) reads[parseInt(m[1])-1]=String(m[2]||'').trim();
    });
    n.photoGuide=ph.map((x,k)=>({
      scene:String((gl[k]&&gl[k].scene)||'').slice(0,220),
      caption:String((gl[k]&&gl[k].caption)||'').slice(0,40),
      read:reads[k]||'', readOk:false
    })).filter(g=>g.scene);
    ph.forEach((x,k)=>{ x.gi=k; x.sec=jDefaultSec(n,k);
      const c=n.photoGuide[k]&&n.photoGuide[k].caption; if(c) x.caption=c; });
    n.guideEdited=true;
    const nRead=Object.keys(reads).filter(k=>reads[k]).length;
    J._aiGuideMsg='✅ 장면 '+n.photoGuide.length+'개를 사진에서 읽어 적었습니다.'
      +(nRead?' 숫자 '+nRead+'건은 <b>눈으로 대조한 뒤</b> [확정]을 누르세요.':' 읽힌 숫자는 없습니다.');
    jGuideRefresh(ym);
  }catch(e){
    show('var(--red)','❌ 통신 실패: '+escapeHtml(e.message||''));
    if(btn){ btn.disabled=false; btn.style.opacity='1'; }
  }
}

/* 빈 장면·사진 없는 장면을 알린 뒤 본문 생성 */
function jGenGuarded(ym){
  const n=jNoteOf(ym); const g=(n&&n.photoGuide)||[]; const ps=(n&&n.photos)||[];
  const cnt={}; ps.forEach(x=>{ const k=(x.gi==null?-1:parseInt(x.gi)); cnt[k]=(cnt[k]||0)+1; });
  const empty=g.filter(x=>!String(x.scene||'').trim()).length;
  const noPh=g.filter((x,i)=>String(x.scene||'').trim() && !cnt[i]).length;
  const unread=g.filter(x=>String(x.read||'').trim() && !x.readOk).length;
  let msg='';
  if(empty) msg+='· 내용이 비어 있는 장면 '+empty+'개 — 본문에 반영되지 않습니다\n';
  if(noPh)  msg+='· 사진이 없는 장면 '+noPh+'개 — 사진 없는 활동이 본문에 서술됩니다\n';
  if(unread) msg+='· 확정하지 않은 숫자 '+unread+'건 — 본문에 쓰이지 않습니다\n';
  if(msg && !confirm(msg+'\n이대로 생성할까요?')) return;
  J._forceGuide=null; jGenerateNote(ym);
}

  const el=document.getElementById('jNoteView');

  <div class="card no-print">
